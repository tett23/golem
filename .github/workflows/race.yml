name: Race

# The tests that look for races between threads, with 40 times the
# repetitions of the pull requests (docs/adr/0075): once a day on main, on
# the days main has changed since the last successful run of this
# workflow, and whenever it is started by hand. After them, with the golem
# of the same commit, the tests that no pull request runs (root ADR 0415,
# items 4 and 5): the comparison with golem v0.1.0-rc4 of root ADRs 0341 to
# 0344, and the terminal of golem repl emet of root ADR 0348.
on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

# It reads the repository, and the runs of this workflow for
# scripts/ci/race-needed.sh (gh run list); it writes nothing. The caches
# of ci.yml are restored, never saved.
permissions:
  contents: read
  actions: read

concurrency:
  group: race
  cancel-in-progress: false

env:
  GHC_VERSION: "9.10.3"
  # cabal-install, for haskell-actions/setup and the key of the Hackage
  # index, whose 01-index.cache another version of cabal cannot read
  CABAL_VERSION: "3.18.2.0"

jobs:
  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # a scheduled run compares its commit with the head of the last
      # successful run; a run started by hand always runs the tests
      - id: needed
        name: Whether main has changed since the last successful run (docs/adr/0075)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then RUN=true; else RUN=$(sh scripts/ci/race-needed.sh "$GITHUB_SHA"); fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - name: Image and GHC directory for the cache keys (docs/adr/0009)
        if: steps.needed.outputs.run == 'true'
        run: |
          test -n "$ImageOS"
          echo "ImageOS=$ImageOS" >> "$GITHUB_ENV"
          echo "GHC_DIR=${GHCUP_INSTALL_BASE_PREFIX:-$HOME}/.ghcup/ghc/$GHC_VERSION" >> "$GITHUB_ENV"
      - name: Restore GHC (docs/adr/0009)
        if: steps.needed.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GHC_DIR }}
          key: ghc-${{ env.GHC_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}
      # cabal reads and writes everything under ~/.cabal, whatever the
      # image and haskell-actions/setup leave in ~/.config/cabal
      # (docs/adr/0201)
      - name: cabal's directory (docs/adr/0201)
        if: steps.needed.outputs.run == 'true'
        run: echo "CABAL_DIR=$HOME/.cabal" >> "$GITHUB_ENV"
      - id: setup
        if: steps.needed.outputs.run == 'true'
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
          cabal-update: false
      - name: cabal uses ~/.cabal (docs/adr/0201)
        if: steps.needed.outputs.run == 'true'
        run: |
          test "$(cabal path -z --config-file)" = "$HOME/.cabal/config"
          test "$(cabal path -z --remote-repo-cache)" = "$HOME/.cabal/packages"
          test "$(cabal path -z --store-dir)" = "$HOME/.cabal/store"
      - name: GHC on the PATH (docs/adr/0009)
        if: steps.needed.outputs.run == 'true'
        run: |
          if [ ! -x "$GHC_DIR/bin/ghc-$GHC_VERSION" ]; then
            test -x "$GHC_DIR/bin/ghc"
            ln -s ghc "$GHC_DIR/bin/ghc-$GHC_VERSION"
          fi
          echo "$GHC_DIR/bin" >> "$GITHUB_PATH"
      - id: index
        name: Restore the Hackage index (docs/adr/0009)
        if: steps.needed.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cabal/packages/hackage.haskell.org
          key: hackage-index-cabal-${{ env.CABAL_VERSION }}-${{ hashFiles('cabal.project.freeze') }}
      - if: steps.needed.outputs.run == 'true' && steps.index.outputs.cache-hit != 'true'
        run: cabal update
      - name: Restore the cabal store
        if: steps.needed.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-store-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}
          restore-keys: cabal-store-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-
      - name: Restore dist-newstyle (docs/adr/0009)
        if: steps.needed.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist-newstyle
          key: dist-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}-${{ hashFiles('scripts/fetch-wasmtime.sh') }}-${{ github.sha }}
          restore-keys: dist-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}-${{ hashFiles('scripts/fetch-wasmtime.sh') }}-
      - name: wasmtime C API (golem-plugin ADR 0001)
        if: steps.needed.outputs.run == 'true'
        run: scripts/fetch-wasmtime.sh
      # the three suites that look for races, and nothing else: the
      # parallel builds of golem-driver, FreeType from many threads, and
      # the shaping from many threads of golem-font-test (docs/adr/0075)
      - name: The race tests, 40 times (docs/adr/0075)
        if: steps.needed.outputs.run == 'true'
        env:
          GOLEM_RACE_TESTS: "40"
        run: |
          cabal test golem-driver-parallel-test golem-font-race-test
          cabal test golem-font-test --test-option=-p --test-option='/one font from many threads/'
      # the golem of this commit, for the steps below (root ADR 0415)
      - name: Build golem (root ADR 0415)
        if: ${{ !cancelled() && steps.needed.outputs.run == 'true' }}
        run: |
          cabal build golem-cli:exe:golem
          echo "GOLEM=$(cabal list-bin -v0 golem-cli:exe:golem)" >> "$GITHUB_ENV"
      # experiments/syntax/*-release.mjs, the tests of root ADRs 0341 to
      # 0343 I3 and I4 and of root ADR 0344 I3 to I5 that compare rc4 with
      # the golem of this commit (root ADR 0415, item 4). The archive of rc4
      # for x86-64 Linux is checked against the SHA256SUMS of the release
      # and against the SHA-256 pinned here before it is unpacked. Once
      # v1.0.0 is released, this step may go: the comparison checks the
      # move from the forms that rc4 retired
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() && steps.needed.outputs.run == 'true' }}
        with:
          node-version: lts/*
      - name: "root ADRs 0341 to 0344 I3, I4: golem v0.1.0-rc4 and the golem of this commit (root ADR 0415)"
        if: ${{ !cancelled() && steps.needed.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RC4_ARCHIVE: golem-v0.1.0-rc4-x86_64-linux.tar.gz
          RC4_SHA256: 6cd9c0a131abac440aa16d417cade126a79bfd6cf7e3ebd4ed2b95349559b3aa
        run: |
          D=$RUNNER_TEMP/rc4
          mkdir -p "$D"
          gh release download v0.1.0-rc4 --pattern "$RC4_ARCHIVE" --pattern SHA256SUMS --dir "$D"
          grep -x "[0-9a-f]\{64\}  $RC4_ARCHIVE" "$D/SHA256SUMS" > "$D/SHA256SUMS.archive"
          (cd "$D" && sha256sum -c SHA256SUMS.archive)
          echo "$RC4_SHA256  $D/$RC4_ARCHIVE" | sha256sum -c -
          tar -xzf "$D/$RC4_ARCHIVE" -C "$D"
          status=0
          for t in line-range listing style-format table; do
            node experiments/syntax/$t-release.mjs "$D/golem-v0.1.0-rc4-x86_64-linux/golem" "$GOLEM" || status=1
          done
          exit "$status"
      # the terminal of golem repl emet, modules/golem-cli/test/repl/terminal.rb
      # under a PTY, with the ruby of the runner; no ruby fails the step
      # (root ADR 0415, item 5)
      - name: "root ADR 0348 I4, I7: the terminal of golem repl emet (root ADR 0415)"
        if: ${{ !cancelled() && steps.needed.outputs.run == 'true' }}
        run: |
          command -v ruby > /dev/null || { echo "root ADR 0348 I4, I7: no ruby on the runner" >&2; exit 1; }
          ruby modules/golem-cli/test/repl/terminal.rb "$GOLEM" || { echo "root ADR 0348 I4, I7: the terminal of golem repl emet failed" >&2; exit 1; }
