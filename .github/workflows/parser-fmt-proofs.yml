name: Parser and formatter proofs
on:
  workflow_call:
  schedule:
    - cron: "17 18 * * *"
permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        model: [eval/Eval, arguments/Arguments, tables/Table, grammar]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lean 4.7.0
        run: sh scripts/ci/install-parser-proof-lean.sh
      - name: Check the model with Lean
        if: matrix.model != 'grammar'
        env:
          MODEL: ${{ matrix.model }}
        run: '"$LEAN" "experiments/parser-fmt-proof/$MODEL.lean"'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.model == 'grammar'
        with:
          node-version: lts/*
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        if: matrix.model != 'arguments/Arguments'
        with:
          ghc-version: "9.10.3"
          cabal-version: "3.18.2.0"
      - name: Update the Cabal index
        if: matrix.model != 'arguments/Arguments'
        run: cabal update
      - name: Build the pinned grammar tools
        if: matrix.model == 'grammar'
        run: |
          cabal build peg-cli:exe:peg-hs
          cabal build --only-dependencies lib:golem-bibliography
          echo "PEG_HS=$(cabal list-bin peg-cli:exe:peg-hs)" >> "$GITHUB_ENV"
      - name: Compare table formatting in Haskell and Lean
        if: matrix.model == 'tables/Table'
        run: sh experiments/parser-fmt-proof/tables/compare-format.sh
      - name: Compare Emet evaluations in Haskell and Lean
        if: matrix.model == 'eval/Eval'
        run: sh experiments/parser-fmt-proof/eval/compare-eval.sh
      - name: Check grammar proofs, mutations and native parser examples
        if: matrix.model == 'grammar'
        run: node experiments/parser-fmt-proof/grammar/test.mjs
      - name: Require the full grammar model
        if: matrix.model == 'grammar'
        run: |
          grammar=experiments/parser-fmt-proof/grammar
          node "$grammar/generate.mjs" modules/golem-parser/grammar/Golem.hpeg "$RUNNER_TEMP/Generated.lean"
          "$LEAN" -o "$RUNNER_TEMP/PegModel.olean" "$grammar/PegModel.lean"
          cd "$RUNNER_TEMP"
          LEAN_PATH=. "$LEAN" Generated.lean

  nightly-cli:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: "9.10.3"
          cabal-version: "3.18.2.0"
      - name: Build the CLI from the scheduled revision
        run: |
          scripts/fetch-wasmtime.sh
          cabal update
          cabal build exe:golem
          echo "GOLEM=$(cabal list-bin exe:golem)" >> "$GITHUB_ENV"
      - name: Install Lean 4.7.0 for the nightly argument comparison
        run: sh scripts/ci/install-parser-proof-lean.sh
      - name: Check the nightly corpus
        run: |
          status=0
          for suite in manuscripts tables arguments eval; do
            sh experiments/parser-fmt-proof/check-suite.sh "$suite" 3 2 || status=1
          done
          exit "$status"
      - name: Save failing manuscripts and replay commands
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parser-fmt-nightly-failures
          path: round-trip-failures
          if-no-files-found: ignore
