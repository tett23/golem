name: Docs

# The checks of the ADRs and the documents. They run on every change, documents
# only included, apart from the build of ci.yml, so that a cancelled run of
# ci.yml or a call of it from release.yml does not touch them
# (docs/adr/0021-docs-workflow-and-ci-gate.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# the same groups as ci.yml (docs/adr/0009)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || format('docs-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  adr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # status-line changes and link-only changes to committed ADRs are allowed;
      # unlinked or mislinked ADR references (module-qualified ones included),
      # ADRs without exactly one status line, duplicate ADR numbers, and
      # changes to committed records (docs/audit/, docs/audits/,
      # docs/benchmarks/, docs/benchmark/) fail
      # (docs/adr/0010, docs/adr/0011, docs/adr/0012, docs/adr/0032,
      # docs/adr/0048, docs/adr/0194)
      - uses: tett23/adr-guard@v0.10.0
        with:
          allow-status: true
          allow-links: true
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  # A pull request that changes the specification or CONTRIBUTING updates a
  # manual too, or says that it does not need to with the trailer
  # "Manual: unchanged" (docs/adr/0024-manual-audiences-and-policy.md)
  manual:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The manual follows the specification
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/manual/check-updated.sh "$PR_BASE" "$PR_HEAD"
      # the outlined figures of the manuals were made from their sources (golem-pdf ADR 0009)
      - name: The outlined figures match their sources
        run: sh scripts/manual/check-figures.sh

  # The Japanese writing rules of the documents: textlint with the pinned
  # rules of tools/textlint/ over docs/, README.md, CONTRIBUTING.md, functions/README.md, the ADRs
  # that the change adds, and the sources of the two manuals
  # (docs/adr/0036-textlint-for-documents.md, docs/adr/0258). Developers run the
  # same script.
  textlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # the merge base with the base finds the ADRs that the change adds
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # node_modules itself is cached, so that a hit skips npm ci; the rules of
      # tools/textlint/rules/ are linked, not copied, and need no new key
      - id: cache
        uses: actions/cache@v6
        with:
          path: tools/textlint/node_modules
          key: textlint-${{ runner.os }}-${{ hashFiles('tools/textlint/package-lock.json') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci --prefix tools/textlint --no-fund --no-audit
      - name: The tests of the Golem rules, the dictionaries and the script
        run: node --test tools/textlint/test/*.test.js
      # The keys of the jobs that reported nothing (docs/adr/0258). A key is
      # the hash of everything a job reads, so a list of any run is correct
      # for this one: the newest is restored, and a miss checks everything.
      # Restored and saved apart, so that a run that reports saves too; saved
      # only when the list changed.
      - name: Restore the keys of the clean jobs (docs/adr/0258)
        uses: actions/cache/restore@v6
        with:
          path: tools/textlint/.cache
          key: textlint-clean-${{ runner.os }}-${{ github.run_id }}
          restore-keys: textlint-clean-${{ runner.os }}-
      - id: restored
        name: The hash of the restored keys
        env:
          HASH: ${{ hashFiles('tools/textlint/.cache/clean') }}
        run: echo "hash=$HASH" >>"$GITHUB_OUTPUT"
      - name: textlint
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: sh scripts/ci/textlint.sh "$BASE"
      - name: Save the keys of the clean jobs (docs/adr/0258)
        if: ${{ !cancelled() && hashFiles('tools/textlint/.cache/clean') != '' && hashFiles('tools/textlint/.cache/clean') != steps.restored.outputs.hash }}
        uses: actions/cache/save@v6
        with:
          path: tools/textlint/.cache
          key: textlint-clean-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Every diagnostic code of docs/diagnostics.md has its anchor in the HTML
  # that GitHub renders of the file, where the URL of golem explain points
  # (docs/adr/0235): on a pull request that changes docs/diagnostics.md or
  # Explain.hs, and on every push to main. A commit of a fork that the API
  # does not give is skipped; the push to main checks it.
  anchors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        name: docs/diagnostics.md or Explain.hs changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            # exit code 3 (no range) or a failure of git: check
            if paths=$(sh scripts/ci/changed-paths.sh "$EVENT" "$BASE" "$HEAD"); then
              printf '%s\n' "$paths" | grep -qx -e docs/diagnostics.md -e modules/golem-driver/src/Golem/Driver/Explain.hs || run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.run == 'true'
        name: The diagnostic codes have their anchors on GitHub (docs/adr/0235)
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GITHUB_ANCHORS_SKIP_UNREACHABLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '1' || '' }}
        run: sh scripts/ci/github-anchors.sh "$COMMIT"
