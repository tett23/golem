# Temporary: benchmark shem v0.1.0-rc3 and v0.1.0-rc4 for docs/adr/0098.
# Lives only on the branch bench-shem-rc4; not for main.
name: bench-shem
on:
  push:
    branches: [bench-shem-rc4]
permissions:
  contents: read
  actions: read
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: The PDFs of main run 41970191773
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41970191773 --repo "$GITHUB_REPOSITORY" -n visual-pdfs -D pdfs && ls -l pdfs
      - name: shem rc3 and rc4
        run: |
          set -eu
          get() {
            curl -fsSL --retry 3 -o "$1.tgz" "https://github.com/tett23/shem/releases/download/v0.1.0-$1/shem-v0.1.0-$1-x86_64-unknown-linux-musl.tar.gz"
            echo "$2  $1.tgz" | sha256sum -c -
            mkdir "$1" && tar -xzf "$1.tgz" -C "$1" --strip-components 1
          }
          get rc3 9a49e705b1ab31cb28f34838561b85627181d743a2f3f68b887374a217b85c1b
          get rc4 5337e1fb4dc5e336f4f84cd051f392c949ef34df1e2edb5159532f941367c0d9
      - name: Benchmark
        run: bash bench/bench.sh pdfs rc3/shem rc4/shem | tee -a "$GITHUB_STEP_SUMMARY"
