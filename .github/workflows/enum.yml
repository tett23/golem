name: Enum

# The invariants on every small input, up to more elements than the pull
# requests check (docs/adr/0204, docs/adr/0208): once a day on main, on
# the days main has changed since the last successful run of this
# workflow, and whenever it is started by hand. One step for each area,
# with its depth and the inputs it draws past the depth; all the steps
# together within 60 minutes (docs/adr/0208, its section 4).
on:
  schedule:
    - cron: "47 18 * * *"
  workflow_dispatch:

# It reads the repository, and the runs of this workflow for
# scripts/ci/race-needed.sh (gh run list); it writes nothing. The caches
# of ci.yml are restored, never saved.
permissions:
  contents: read
  actions: read

concurrency:
  group: enum
  cancel-in-progress: false

env:
  GHC_VERSION: "9.10.3"

jobs:
  enum:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # a scheduled run compares its commit with the head of the last
      # successful run; a run started by hand always runs the tests
      - id: needed
        name: Whether main has changed since the last successful run (docs/adr/0075, docs/adr/0204)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then RUN=true; else RUN=$(sh scripts/ci/race-needed.sh "$GITHUB_SHA" enum.yml); fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - name: Image and GHC directory for the cache keys (docs/adr/0009)
        if: steps.needed.outputs.run == 'true'
        run: |
          test -n "$ImageOS"
          echo "ImageOS=$ImageOS" >> "$GITHUB_ENV"
          echo "GHC_DIR=${GHCUP_INSTALL_BASE_PREFIX:-$HOME}/.ghcup/ghc/$GHC_VERSION" >> "$GITHUB_ENV"
      - name: Restore GHC (docs/adr/0009)
        if: steps.needed.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GHC_DIR }}
          key: ghc-${{ env.GHC_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}
      # cabal reads and writes everything under ~/.cabal, whatever the
      # image and haskell-actions/setup leave in ~/.config/cabal
      # (docs/adr/0201)
      - name: cabal's directory (docs/adr/0201)
        if: steps.needed.outputs.run == 'true'
        run: echo "CABAL_DIR=$HOME/.cabal" >> "$GITHUB_ENV"
      - id: setup
        if: steps.needed.outputs.run == 'true'
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: "3.16.1.0"
          cabal-update: false
      - name: cabal uses ~/.cabal (docs/adr/0201)
        if: steps.needed.outputs.run == 'true'
        run: |
          test "$(cabal path -z --config-file)" = "$HOME/.cabal/config"
          test "$(cabal path -z --remote-repo-cache)" = "$HOME/.cabal/packages"
          test "$(cabal path -z --store-dir)" = "$HOME/.cabal/store"
      - name: GHC on the PATH (docs/adr/0009)
        if: steps.needed.outputs.run == 'true'
        run: |
          if [ ! -x "$GHC_DIR/bin/ghc-$GHC_VERSION" ]; then
            test -x "$GHC_DIR/bin/ghc"
            ln -s ghc "$GHC_DIR/bin/ghc-$GHC_VERSION"
          fi
          echo "$GHC_DIR/bin" >> "$GITHUB_PATH"
      - id: index
        name: Restore the Hackage index (docs/adr/0009)
        if: steps.needed.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cabal/packages/hackage.haskell.org
          key: hackage-index-${{ hashFiles('cabal.project.freeze') }}
      - if: steps.needed.outputs.run == 'true' && steps.index.outputs.cache-hit != 'true'
        run: cabal update
      - name: Restore the cabal store
        if: steps.needed.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-store-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}
          restore-keys: cabal-store-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-
      - name: Restore dist-newstyle (docs/adr/0009)
        if: steps.needed.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: dist-newstyle
          key: dist-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}-${{ hashFiles('scripts/fetch-wasmtime.sh') }}-${{ github.sha }}
          restore-keys: dist-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}-${{ hashFiles('scripts/fetch-wasmtime.sh') }}-
      # built apart, so that the time of each step below is its tests'
      - name: Build the test suites
        if: steps.needed.outputs.run == 'true'
        run: cabal build golem-layout-test
      # pagination: every input of the shortened enumeration of up to
      # GOLEM_ENUM_DEPTH elements, and inputs of one element more drawn from
      # the enumeration of docs/adr/0204; the pull requests check up to the
      # depth of PaginateInvariantsSpec.prDepth and draw none
      - name: The pagination invariants on every small input (docs/adr/0204, docs/adr/0208)
        if: steps.needed.outputs.run == 'true'
        env:
          GOLEM_ENUM_DEPTH: "5"
          GOLEM_ENUM_PAGINATION_SAMPLES: "5000000"
        run: cabal test golem-layout-test --test-option=-p --test-option='/pagination invariants/&&/every input/'
      # line breaking: every input of up to GOLEM_ENUM_LINES_DEPTH parts in
      # lines of up to 5 em, and inputs of one part more drawn; the pull
      # requests check up to LineBreakInvariantsSpec.linesPrDepth parts in
      # lines of up to 4 em and draw none
      - name: The line breaking invariants on every small input (docs/adr/0209)
        if: steps.needed.outputs.run == 'true'
        env:
          GOLEM_ENUM_LINES_DEPTH: "3"
          GOLEM_ENUM_LINES_SAMPLES: "5000000"
        run: cabal test golem-layout-test --test-option=-p --test-option='/line breaking invariants on/'
      # the ranges that do not break: every input of up to
      # GOLEM_ENUM_NOBREAK_DEPTH parts; the pull requests check up to 2
      # (docs/adr ADR 0272)
      - name: The ranges that do not break on every small input (docs/adr ADR 0272)
        if: steps.needed.outputs.run == 'true'
        env:
          GOLEM_ENUM_NOBREAK_DEPTH: "3"
        run: cabal test golem-layout-test --test-option=-p --test-option='/ranges that do not break on every small input/'
