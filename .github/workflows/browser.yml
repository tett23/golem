name: Browser

# The HTML of golem and golem.wasm in browsers and other hosts of WASI
# (docs/adr/0234): the checks of scripts/browser/ in chrome-headless-shell
# pinned by version and SHA-256 and in the Safari of the macOS runner, and
# golem.wasm under Deno, under the C API of wasmtime (docs/adr/0238) and
# with browser_wasi_shim in both browsers, against the native list of the
# same commit. Once a day on main, on the days main
# has changed since the last successful run of this workflow, and whenever
# it is started by hand; never on pull requests. It builds nothing: the
# inputs are the artifacts of the last successful ci.yml of main.
on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

# It reads the repository and the runs and artifacts of ci.yml and of this
# workflow; it writes nothing but its own artifact and its caches.
permissions:
  contents: read
  actions: read

concurrency:
  group: browser
  cancel-in-progress: false

# The times of the jobs are twice those measured in the pull request of the
# implementation (docs/ci-timings/2026-11-08-browser-workflow.md); that of
# chromium, with wasmtime, in the pull request of docs/adr/0238
# (docs/ci-timings/2026-11-08-wasmtime-in-browser-workflow.md).
jobs:
  # the inputs of both browsers: golem.wasm, the native list, the HTML of
  # the manuals and of the fixtures of scripts/browser/fixtures, built with
  # the golem of ci.yml (golem-linux-x86_64, docs/adr/0231)
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      run: ${{ steps.needed.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # a scheduled run compares its commit with the head of the last
      # successful run; a run started by hand always runs the checks
      - id: needed
        name: Whether main has changed since the last successful run (docs/adr/0075)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then RUN=true; else RUN=$(sh scripts/ci/race-needed.sh "$GITHUB_SHA" browser.yml); fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.needed.outputs.run == 'true'
        with:
          node-version: lts/*
      # the commands of webdriver.mjs against a fake WebDriver server, and
      # the parts of the checks that need no browser
      - name: The tests that need no browser (docs/adr/0234)
        if: steps.needed.outputs.run == 'true'
        run: node --test scripts/browser/test/unit.test.mjs
      # the last successful push to main whose run still has every
      # artifact; a push that changed docs only builds nothing
      - name: The artifacts of the last successful ci.yml of main
        if: steps.needed.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN=
          for id in $(gh run list --workflow ci.yml --branch main --event push --status success --limit 30 --json databaseId --jq '.[].databaseId'); do
            names=" $(gh api "repos/$GH_REPO/actions/runs/$id/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired | not) | .name] | join(" ")') "
            all=true
            for a in golem-wasm wasm-native-list manual manual-dev golem-linux-x86_64; do
              case "$names" in *" $a "*) ;; *) all=false ;; esac
            done
            if [ "$all" = true ]; then RUN=$id; break; fi
          done
          test -n "$RUN" || { echo "no successful run of ci.yml on main has the artifacts" >&2; exit 1; }
          echo "ci.yml run $RUN, commit $(gh run view "$RUN" --json headSha --jq .headSha)" | tee -a "$GITHUB_STEP_SUMMARY"
          gh run download "$RUN" -n golem-wasm -n wasm-native-list -n manual -n manual-dev -n golem-linux-x86_64 -D "$RUNNER_TEMP/ci"
      - name: The HTML of the fixtures, and the inputs of the browsers
        if: steps.needed.outputs.run == 'true'
        run: |
          GOLEM=$(find "$RUNNER_TEMP/ci/golem-linux-x86_64" -type f -name golem | head -n 1)
          test -n "$GOLEM"
          chmod +x "$GOLEM"
          GOLEM="$GOLEM" sh scripts/browser/build-fixtures.sh browser-inputs
          mkdir -p browser-inputs/manual browser-inputs/manual-dev
          cp -R "$RUNNER_TEMP/ci/manual/html" browser-inputs/manual/html
          cp -R "$RUNNER_TEMP/ci/manual-dev/html" browser-inputs/manual-dev/html
          cp "$RUNNER_TEMP/ci/golem-wasm/golem.wasm" "$RUNNER_TEMP/ci/wasm-native-list/wasm-native-list.txt" browser-inputs/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.needed.outputs.run == 'true'
        with:
          name: browser-inputs
          path: browser-inputs

  # chrome-headless-shell of scripts/browser/fetch-chromium.sh, Deno of
  # scripts/wasm/fetch-deno.sh, and the C API of wasmtime of
  # scripts/fetch-wasmtime.sh (docs/adr/0238); their archives are cached
  # by the hash of the three scripts (docs/adr/0243)
  chromium:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    env:
      # an input of golem.wasm that does not end is stopped well before the
      # time-out of the job, so that the list says `exit timeout` for it
      # (docs/adr/0247 section 7); the 14 inputs take about 90 seconds in
      # all (docs/ci-timings/2026-11-08-wasmtime-in-browser-workflow.md)
      COMPARE_TIMEOUT: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-inputs
          path: browser-inputs
      # restored and saved apart, so that a run whose checks fail saves
      # them too; only the runs of main save (docs/adr/0228). Each archive
      # is checked by its SHA-256 before it is unpacked (docs/adr/0243)
      - id: downloads
        name: Restore the archives of the downloads (docs/adr/0243)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/downloads
          key: downloads-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/browser/fetch-chromium.sh', 'scripts/wasm/fetch-deno.sh', 'scripts/fetch-wasmtime.sh') }}
      # each fetch has a step of its own and its timeout-minutes, which holds
      # the worst time of the retries of fetch-url.sh, about 7 minutes
      # (docs/adr/0243, docs/adr/0259)
      - name: chrome-headless-shell, pinned by version and SHA-256
        timeout-minutes: 10
        run: sh scripts/browser/fetch-chromium.sh
      - name: deno, pinned by version and SHA-256
        timeout-minutes: 10
        run: sh scripts/wasm/fetch-deno.sh
      - name: The C API of wasmtime, pinned by version and SHA-256 (docs/adr/0238)
        timeout-minutes: 10
        run: sh scripts/fetch-wasmtime.sh
      - name: Save the archives of the downloads (docs/adr/0243)
        if: github.ref == 'refs/heads/main' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: browser_wasi_shim
        working-directory: scripts/browser
        run: npm ci --ignore-scripts
      - id: ready
        name: The versions
        run: |
          {
            echo "| What | Version |"
            echo "| --- | --- |"
            echo "| chrome-headless-shell | $(third_party/chromium/chrome-headless-shell-linux64/chrome-headless-shell --version) |"
            echo "| chrome-headless-shell zip | $(sh scripts/browser/fetch-chromium.sh --expected) |"
            echo "| Arguments of the check of the outlined figures (docs/adr/0239) | $(node --input-type=module -e "import { chromiumArgs } from './scripts/browser/browsers.mjs'; console.log(chromiumArgs('svg').join(' '))") |"
            echo "| Deno | $(third_party/deno/deno --version | head -n 1) |"
            echo "| Node | $(node --version) |"
            echo "| wasmtime C API | $(cat third_party/wasmtime/VERSION) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The HTML of golem (docs/adr/0234 section 3)
        if: always() && steps.ready.outcome == 'success'
        run: node scripts/browser/run.mjs chromium html browser-inputs
      - name: The text of the outlined figures (docs/adr/0234 section 4, docs/adr/0239)
        if: always() && steps.ready.outcome == 'success'
        run: node scripts/browser/run.mjs chromium svg manual-dev/images browser-inputs/manual-dev/html/fonts
      - name: The checks on the pages of scripts/browser/test (docs/adr/0234)
        if: always() && steps.ready.outcome == 'success'
        env:
          BROWSER: chromium
        run: node --test scripts/browser/test/browser.test.mjs
      - name: golem.wasm under Deno is the native golem (docs/adr/0234 section 5, I5)
        if: always() && steps.ready.outcome == 'success'
        run: |
          DENO=third_party/deno/deno sh scripts/wasm/compare.sh --deno browser-inputs/golem.wasm > deno-list.txt
          sh scripts/wasm/compare.sh --check browser-inputs/wasm-native-list.txt deno-list.txt
      - name: golem.wasm in Chromium is the native golem (docs/adr/0234 section 5, I5)
        if: always() && steps.ready.outcome == 'success'
        run: |
          sh scripts/wasm/compare.sh --browser chromium browser-inputs/golem.wasm > chromium-list.txt
          sh scripts/wasm/compare.sh --check browser-inputs/wasm-native-list.txt chromium-list.txt
      - name: golem.wasm under the C API of wasmtime is the native golem (docs/adr/0238 section 5, I2)
        if: always() && steps.ready.outcome == 'success'
        run: |
          sh scripts/wasm/compare.sh --wasmtime browser-inputs/golem.wasm > wasmtime-list.txt
          sh scripts/wasm/compare.sh --check browser-inputs/wasm-native-list.txt wasmtime-list.txt
      # the same input frames give the same result frames under both hosts:
      # a path that is not normalised (status 1), no file, and kanikosen (I5)
      - name: The call of run-wasmtime.c is that of run.mjs (docs/adr/0238 I5)
        if: always() && steps.ready.outcome == 'success'
        run: |
          H=$RUNNER_TEMP/wasmtime
          F=$RUNNER_TEMP/frames
          sh scripts/wasm/run-wasmtime.sh compile browser-inputs/golem.wasm "$H"
          mkdir -p "$F"
          printf '\017\000\000\000./manifest.toml\000\000\000\000' > "$F/not-normalised"
          : > "$F/empty"
          node --no-warnings scripts/wasm/run.mjs frame modules/golem-driver/test/fixtures/kanikosen > "$F/kanikosen"
          for f in not-normalised empty kanikosen; do
            "$H/run-wasmtime" call "$H/golem.cwasm" < "$F/$f" > "$F/$f.wasmtime"
            node --no-warnings scripts/wasm/run.mjs call browser-inputs/golem.wasm < "$F/$f" > "$F/$f.node"
            cmp "$F/$f.wasmtime" "$F/$f.node"
            echo "$f: the same $(wc -c < "$F/$f.node") bytes"
          done
          test "$(od -An -tu1 -N1 "$F/not-normalised.node" | tr -d ' ')" = 1
      # a host built with an upper bound of 64 bytes on the input frame:
      # 64 bytes are passed on, 65 stop before golem_alloc (docs/adr/0289)
      - name: The bound of run-wasmtime.c on the input frame (docs/adr/0289 H1, H2)
        if: always() && steps.ready.outcome == 'success'
        run: |
          H=$RUNNER_TEMP/wasmtime
          F=$RUNNER_TEMP/frames
          W=third_party/wasmtime
          cc -O2 -DRUN_WASMTIME_MAX_INPUT=64 -I"$W/include" -o "$H/run-wasmtime-64" scripts/wasm/run-wasmtime.c "$W/lib/libwasmtime.a" -lpthread -ldl -lm
          head -c 64 "$F/kanikosen" > "$F/64"
          head -c 65 "$F/kanikosen" > "$F/65"
          test "$(wc -c < "$F/64" | tr -d ' ')" = 64
          test "$(wc -c < "$F/65" | tr -d ' ')" = 65
          code=0
          "$H/run-wasmtime-64" call "$H/golem.cwasm" < "$F/64" > "$F/64.out" 2> "$F/64.err" || code=$?
          cat "$F/64.err" >&2
          test "$code" != 3 || { echo "H1: 64 bytes, the bound, exit 3" >&2; exit 1; }
          echo "H1: 64 bytes, the bound, exit $code"
          code=0
          "$H/run-wasmtime-64" call "$H/golem.cwasm" < "$F/65" > "$F/65.out" 2> "$F/65.err" || code=$?
          cat "$F/65.err" >&2
          test "$code" = 3 || { echo "H2: 65 bytes exit $code, not 3" >&2; exit 1; }
          test ! -s "$F/65.out" || { echo "H2: 65 bytes write to stdout" >&2; exit 1; }
          grep -qxF 'run-wasmtime: the input frame is larger than 64 bytes' "$F/65.err" || { echo "H2: 65 bytes do not say the bound" >&2; exit 1; }
          if grep -qF golem_alloc "$F/65.err"; then echo "H2: 65 bytes reach golem_alloc" >&2; exit 1; fi
          echo "H2: 65 bytes, one over the bound, exit 3 before golem_alloc"

  # the Safari of the image of the runner, not pinned: the versions are
  # written to the summary of the job, whether the checks pass or fail. A
  # failure is not retried nor ignored (docs/adr/0234 section 6)
  safari:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      COMPARE_TIMEOUT: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The versions of macOS, the image and Safari (docs/adr/0234 section 6)
        run: sh scripts/browser/safari-versions.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-inputs
          path: browser-inputs
      - name: browser_wasi_shim
        working-directory: scripts/browser
        run: npm ci --ignore-scripts
      - id: ready
        name: Remote automation of Safari
        run: sudo safaridriver --enable
      - name: The HTML of golem (docs/adr/0234 section 3)
        if: always() && steps.ready.outcome == 'success'
        env:
          BROWSER_VERSION_FILE: ${{ runner.temp }}/browser-version
        run: node scripts/browser/run.mjs safari html browser-inputs
      # vertical text is measured but not judged (docs/adr/0239 I2), and
      # horizontal text is judged with 8 CSS px (SAFARI of svg-text.mjs)
      - name: The text of the outlined figures (docs/adr/0234 section 4, docs/adr/0239)
        if: always() && steps.ready.outcome == 'success'
        run: node scripts/browser/run.mjs safari svg manual-dev/images browser-inputs/manual-dev/html/fonts
      - name: The checks on the pages of scripts/browser/test (docs/adr/0234)
        if: always() && steps.ready.outcome == 'success'
        env:
          BROWSER: safari
        run: node --test scripts/browser/test/browser.test.mjs
      - name: golem.wasm in Safari is the native golem (docs/adr/0234 section 5, I5)
        if: always() && steps.ready.outcome == 'success'
        run: |
          sh scripts/wasm/compare.sh --browser safari browser-inputs/golem.wasm > safari-list.txt
          sh scripts/wasm/compare.sh --check browser-inputs/wasm-native-list.txt safari-list.txt
      - name: Timed-out builds leave fewer WebContent processes than inputs (docs/adr/0309 I1, I5)
        if: always() && steps.ready.outcome == 'success'
        run: sh scripts/wasm/test/browser-leftovers.sh
      # the table with the browserVersion of the WebDriver session, when
      # one was made (I7)
      - name: The versions in the summary
        if: always()
        env:
          BROWSER_VERSION_FILE: ${{ runner.temp }}/browser-version
        run: sh scripts/browser/safari-versions.sh "$(cat "$BROWSER_VERSION_FILE" 2>/dev/null || true)" >> "$GITHUB_STEP_SUMMARY"
