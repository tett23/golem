name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs the same build, tests and determinism check before a
  # release (docs/adr/0004)
  workflow_call:

# The jobs only read the repository; caches and artifacts need no token
# scope (docs/adr/0035)
permissions:
  contents: read

# A new push to a pull request cancels its running checks; pushes to main and
# calls from release.yml each get a group of their own, so that every commit
# of main is checked (docs/adr/0009)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # written once, for haskell-actions/setup and the cache keys (docs/adr/0009)
  GHC_VERSION: "9.10.3"
  # cabal-install, for haskell-actions/setup and the key of the Hackage
  # index, whose 01-index.cache another version of cabal cannot read
  CABAL_VERSION: "3.18.2.0"
  CDDL_VERSION: "0.10.7"
  # the release zip of w3c/epubcheck, for the cache key and its check
  # (docs/adr/0062)
  EPUBCHECK_VERSION: "5.4.0"
  EPUBCHECK_SHA256: "33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c"
  # mise, which installs the pinned Claude Code of mise.toml, at an exact
  # version and the SHA-256 of its linux-x64 binary (docs/adr/0085)
  MISE_VERSION: "2026.11.5"
  MISE_SHA256: "7a5b051d6f17d335c502f8047a5175cf3103f347d91942771c60da4e302ebcb0"
  # veraPDF from nixpkgs at a fixed commit, and the store path of its
  # x86-64 Linux output there; a pull request changes both to move it
  # (docs/adr/0183)
  VERAPDF_NIXPKGS_REV: "1d060086d60cb76a40cf37109f979d88a5bd6396"
  VERAPDF_STORE_PATH: "/nix/store/6bmwf91qar7fx3kcmq402mbh1k7ihwyk-verapdf-1.30.2"

jobs:
  # Whether the change needs the build and the checks: not when it touches
  # only docs/ and the Markdown files at the root (docs/adr/0009). The tests
  # of the scripts run beside it, in scripts-linux, so that the build does
  # not wait for them (docs/adr/0097)
  changes:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The documents that the build reads are listed (docs/adr/0021)
        run: sh scripts/ci/docs-refs.sh
      - name: Every package errors on incomplete patterns (docs/adr/0027)
        run: sh scripts/ci/incomplete-patterns.sh
      - name: Every package errors on warnings (docs/adr/0245)
        run: sh scripts/ci/werror.sh
      - name: The uses of unsafePerformIO are the listed ones (docs/adr/0034)
        run: sh scripts/ci/unsafe-io.sh
      - name: No program changes its number of capabilities while it runs
        run: sh scripts/ci/rts-capabilities.sh
      - name: Every test suite has a limit on each architecture (docs/adr ADR 0292)
        run: sh scripts/ci/suite-limits.sh --check
      - name: The ABI version of plugins follows the last release (docs/adr/0052)
        run: sh scripts/ci/abi-version.sh
      - name: The diagnostic codes keep the promise of 1.x (docs/adr/0174)
        run: sh scripts/ci/diagnostic-codes.sh
      - name: The grammar reference of Emet defines the rules of Emet.hpeg
        run: sh scripts/ci/emet-grammar-doc.sh
      - id: decide
        name: Paths of the change
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # a pull request from its merge base, a push to main from the
          # commit before; called from release.yml (a tag push or
          # workflow_dispatch) there is no range, and everything is built
          # (docs/adr/0021)
          case "$EVENT" in
            pull_request) BASE=$PR_BASE HEAD=$PR_HEAD ;;
            push) if [ "$GITHUB_REF" = refs/heads/main ]; then BASE=$BEFORE HEAD=$GITHUB_SHA; else BASE= HEAD=; fi ;;
            *) BASE= HEAD= ;;
          esac
          if PATHS=$(sh scripts/ci/changed-paths.sh "$EVENT" "$BASE" "$HEAD"); then
            printf '%s\n' "$PATHS"
            BUILD=$(printf '%s\n' "$PATHS" | sh scripts/ci/needs-build.sh)
          else
            BUILD=true
          fi
          echo "build=$BUILD"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  # The tests of the scripts, never skipped: they ran in changes before
  # (docs/adr/0009, docs/adr/0097)
  scripts-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the node of the tests of scripts/wasm/legacy-eh.sh (docs/adr/0238)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Tests of the CI scripts (docs/adr/0009)
        run: sh scripts/ci/test.sh
      - name: Every action is pinned by the SHA of a commit (docs/adr/0296)
        run: sh scripts/ci/actions-pins.sh check
      - name: Tests of the scripts of the manuals (docs/adr/0022, docs/adr/0024)
        run: sh scripts/manual/test.sh
      - name: Tests of the environment check (docs/adr/0029)
        run: sh scripts/env-determinism/test.sh
      - name: Tests of the scripts run by hand (docs/adr/0078)
        run: sh scripts/test.sh
      - name: Tests of the scripts of the visual regression test (docs/adr/0093)
        run: sh scripts/visual/test.sh

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 30
    # On x86-64 four runners build the same commit: two run the tests (the
    # suites of golem-driver, and the rest, by scripts/ci/test-suites.sh),
    # one makes the outputs (the PDFs of the visual regression test, the
    # determinism check, the two manuals and epubcheck), one runs the
    # environment check. On aarch64 two runners run the tests, split in the
    # same way, and one makes the outputs. The work is bound by the four
    # cores of a runner, and the runners end at about the same time; one
    # runner of each architecture saves dist-newstyle (docs/adr/0045,
    # docs/adr/0097, docs/adr/0140, docs/adr/0155)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            part: tests-driver
            tests: true
            outputs: false
            env: false
            suites: driver
            save: true
          - runner: ubuntu-24.04
            part: tests-rest
            tests: true
            outputs: false
            env: false
            suites: rest
            save: false
          - runner: ubuntu-24.04
            part: outputs
            tests: false
            outputs: true
            env: false
            suites: none
            save: false
          - runner: ubuntu-24.04
            part: env
            tests: false
            outputs: false
            env: true
            suites: none
            save: false
          - runner: ubuntu-24.04-arm
            part: tests-driver
            tests: true
            outputs: false
            env: false
            suites: driver
            save: true
          - runner: ubuntu-24.04-arm
            part: tests-rest
            tests: true
            outputs: false
            env: false
            suites: rest
            save: false
          - runner: ubuntu-24.04-arm
            part: outputs
            tests: false
            outputs: true
            env: false
            suites: none
            save: false
    name: build (${{ matrix.runner }}, ${{ matrix.part }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # apt-get takes about 20 seconds; it runs while the caches are
      # restored and cabal builds, and the step before the tests waits for
      # it. A stalled mirror fails it in 5 minutes (docs/adr/0009,
      # docs/adr/0037)
      # the tests need qpdf and Poppler (pdftoppm and pdfinfo), and the
      # check of the typefaces of the manuals on the x86-64 runner of the
      # outputs needs qpdf (docs/adr/0232); one apt-get for both
      - name: qpdf in the background (golem-pdf ADR 0001)
        if: matrix.tests || (matrix.runner == 'ubuntu-24.04' && matrix.outputs)
        run: sh scripts/ci/bg.sh start apt timeout -k 10 300 sh scripts/ci/apt-install.sh qpdf poppler-utils
      # epubcheck checks the EPUB of x86-64. It comes from the release zip
      # of w3c/epubcheck, not from apt, and runs with the Java of the
      # runner image; the zip is cached by its version and SHA-256
      # (golem-epub ADR 0001, docs/adr/0062). It runs in the background, so that
      # 600 seconds, not a timeout-minutes, bound the retries of fetch-url.sh
      # (docs/adr/0259)
      - name: Cache the release of epubcheck (docs/adr/0062)
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/epubcheck/zip
          key: epubcheck-${{ env.EPUBCHECK_VERSION }}-${{ env.EPUBCHECK_SHA256 }}
      - name: epubcheck in the background (golem-epub ADR 0001, docs/adr/0062)
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        run: |
          sh scripts/ci/bg.sh start epubcheck timeout -k 10 600 sh scripts/ci/epubcheck-install.sh "$EPUBCHECK_VERSION" "$EPUBCHECK_SHA256"
      # Every cabal command below reads the test wrapper from
      # cabal.project.local. Given on the command line of cabal test
      # alone, it changed the configuration of the local packages between
      # cabal build and cabal test, so that each of them configured every
      # package again, and golem-font compiled HarfBuzz again (docs/adr/0037)
      - name: The test wrapper for every cabal command (docs/adr/0037)
        run: |
          printf -- '-- written by ci.yml (docs/adr/0037)\ntest-wrapper: %s/scripts/ci/suite-timeout.sh\n' "$PWD" >> cabal.project.local
      - name: Image and GHC directory for the cache keys (docs/adr/0009)
        run: |
          # ImageOS is set on the runner, not in the env context
          test -n "$ImageOS"
          echo "ImageOS=$ImageOS" >> "$GITHUB_ENV"
          # ghcup installs into $GHCUP_INSTALL_BASE_PREFIX/.ghcup, which is
          # /usr/local on x86-64 and unset (so $HOME) on aarch64
          echo "GHC_DIR=${GHCUP_INSTALL_BASE_PREFIX:-$HOME}/.ghcup/ghc/$GHC_VERSION" >> "$GITHUB_ENV"
      # without its documentation and its libraries for profiling, which
      # CI does not read: the step after haskell-actions/setup removes them
      # when the cache missed, and the cache is saved at the end of the job
      # (docs/adr/0141)
      - id: ghc
        name: Cache GHC (docs/adr/0009, docs/adr/0141)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GHC_DIR }}
          key: ghc-${{ env.GHC_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-slim
      # cabal reads and writes everything under ~/.cabal, whatever the
      # image and haskell-actions/setup leave in ~/.config/cabal
      # (docs/adr/0201)
      - name: cabal's directory (docs/adr/0201)
        run: echo "CABAL_DIR=$HOME/.cabal" >> "$GITHUB_ENV"
      - id: setup
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
          cabal-update: false
      - name: cabal uses ~/.cabal (docs/adr/0201)
        run: |
          test "$(cabal path -z --config-file)" = "$HOME/.cabal/config"
          test "$(cabal path -z --remote-repo-cache)" = "$HOME/.cabal/packages"
          test "$(cabal path -z --store-dir)" = "$HOME/.cabal/store"
      - name: The files of GHC that CI does not read (docs/adr/0141)
        if: steps.ghc.outputs.cache-hit != 'true'
        run: |
          rm -rf "$GHC_DIR/share/doc"
          find "$GHC_DIR" -type f \( -name '*_p.a' -o -name '*.p_hi' \) -delete
          du -sh "$GHC_DIR"
      - name: GHC on the PATH (docs/adr/0009)
        # On a cache hit of GHC, ghcup skips the install and does not link
        # ghc-$GHC_VERSION into its bin directory, so cabal (with-compiler:
        # ghc-9.10.3) finds it in the GHC directory itself
        run: |
          if [ ! -x "$GHC_DIR/bin/ghc-$GHC_VERSION" ]; then
            test -x "$GHC_DIR/bin/ghc"
            ln -s ghc "$GHC_DIR/bin/ghc-$GHC_VERSION"
          fi
          echo "$GHC_DIR/bin" >> "$GITHUB_PATH"
      # without 01-index.tar.gz: cabal plans a build from 01-index.tar and
      # its indices, and the compressed copy does not shrink in the cache.
      # The step of cabal update removes it, and the cache is saved at the
      # end of the job; a line with ! in the path took nothing out
      # (docs/adr/0141, docs/adr/0152)
      - id: index
        name: Cache the Hackage index (docs/adr/0009, docs/adr/0141, docs/adr/0152)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cabal/packages/hackage.haskell.org
          key: hackage-index-no-gz-cabal-${{ env.CABAL_VERSION }}-${{ hashFiles('cabal.project.freeze') }}
      # rm without -f: if cabal names the file otherwise, the step fails
      - if: steps.index.outputs.cache-hit != 'true'
        run: |
          cabal update
          ls -l ~/.cabal/packages/hackage.haskell.org/01-index.tar.gz
          rm ~/.cabal/packages/hackage.haskell.org/01-index.tar.gz
          du -sh ~/.cabal/packages/hackage.haskell.org
      - name: Cache the cabal store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-store-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}
          restore-keys: cabal-store-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-
      - name: Restore dist-newstyle (docs/adr/0009)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist-newstyle
          key: dist-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}-${{ hashFiles('scripts/fetch-wasmtime.sh') }}-${{ github.sha }}
          restore-keys: dist-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}-${{ hashFiles('scripts/fetch-wasmtime.sh') }}-
      # Setup configures a component again when its .cabal file is newer
      # than its setup-config, by the times alone. The .cabal files of the
      # checkout are always newer than the restored setup-config, so cabal
      # test configured and linked every test suite again before running
      # it. cabal-install still sees a changed .cabal file by its content
      # (docs/adr/0147)
      - name: The setup-config of dist-newstyle newer than the .cabal files (docs/adr/0147)
        run: |
          if [ -d dist-newstyle ]; then find dist-newstyle -name setup-config -exec touch {} +; fi
      # the archives of the downloads, from the cache of main; each is checked
      # by its SHA-256 before it is used (docs/adr/0243)
      - id: downloads
        name: Restore the archives of the downloads (docs/adr/0243)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/downloads
          key: downloads-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-wasmtime.sh') }}
      # the retries of scripts/ci/fetch-url.sh take 7 minutes at the most
      - name: wasmtime C API (golem-plugin ADR 0001)
        timeout-minutes: 10
        run: scripts/fetch-wasmtime.sh
      # a push to main saves the archives it fetched (docs/adr/0228, docs/adr/0243)
      - name: Save the archives of the downloads (docs/adr/0243)
        if: matrix.save && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - id: cddl
        name: Cache the cddl CLI (docs/adr/0009)
        if: matrix.tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cddl
          key: cddl-${{ env.CDDL_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}
      - name: cddl CLI for the schema test (golem-doc ADR 0001)
        if: matrix.tests && steps.cddl.outputs.cache-hit != 'true'
        run: cargo install cddl --version "$CDDL_VERSION" --locked
      # peg-cli is built with the rest, for the check of the generated
      # parser. compiled is true when GHC compiled a module, that is, when
      # dist-newstyle is no longer the one restored above (docs/adr/0045)
      - id: build
        name: cabal build all peg-cli:exe:peg-hs
        shell: bash
        run: |
          cabal build all peg-cli:exe:peg-hs 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -qE '^\[ *[0-9]+ of [0-9]+\] Compiling ' "$RUNNER_TEMP/build.log"; then COMPILED=true; else COMPILED=false; fi
          echo "compiled=$COMPILED" >> "$GITHUB_OUTPUT"
      # in the plan of the build above, no library nor executable depends
      # on golem-test-support, which only the test suites use (docs/adr/0028)
      - name: Only the test suites depend on golem-test-support (docs/adr/0028)
        run: sh scripts/ci/test-only-deps.sh dist-newstyle/cache/plan.json
      # golem-doc, the semantic IR and the plugin ABI, depends on none of
      # the packages split from it, and golem-bibliography and
      # golem-numerals do not depend on golem-doc (docs/adr/0173)
      - name: The direction of the packages split from golem-doc (docs/adr/0173)
        run: sh scripts/ci/doc-deps.sh dist-newstyle/cache/plan.json
      # cabal does not see a new libwasmtime.a under extra-lib-dirs, so a
      # golem of a restored dist-newstyle may keep an old one (docs/adr/0156)
      - name: golem is linked with the wasmtime of fetch-wasmtime.sh (docs/adr/0156)
        run: sh scripts/check-wasmtime-linked.sh "$(cabal list-bin -v0 golem)"
      # golem for the job editors-lsp, which waits for it as visual waits
      # for visual-pdfs (docs/adr/0099, docs/adr/0231). It comes first of
      # the outputs, so that editors-lsp starts while this runner goes on
      - name: Copy golem for the job editors-lsp (docs/adr/0231)
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        run: mkdir golem-linux-x86_64 && cp "$(cabal list-bin -v0 golem)" golem-linux-x86_64/golem
      - name: Upload golem for the job editors-lsp (docs/adr/0231)
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golem-linux-x86_64
          path: golem-linux-x86_64
      - name: qpdf is installed
        if: matrix.tests || (matrix.runner == 'ubuntu-24.04' && matrix.outputs)
        timeout-minutes: 5
        run: sh scripts/ci/bg.sh wait apt
      # epubcheck goes on PATH here, after cabal build: cabal keeps PATH in
      # the configuration of every package, and a directory added before
      # the build on this runner alone made it configure and build every
      # package again (docs/adr/0097)
      - name: epubcheck is installed
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        timeout-minutes: 5
        run: |
          sh scripts/ci/bg.sh wait epubcheck
          echo "$RUNNER_TEMP/epubcheck/bin" >> "$GITHUB_PATH"
      # qpdf, cddl and openssl are installed above (openssl comes with the
      # runner image): a test that needs one of them fails here instead of
      # being skipped. A suite that does not finish in 10 minutes is
      # stopped and fails (the test wrapper scripts/ci/suite-timeout.sh in
      # cabal.project.local); the step itself stops after 20, so that a
      # hang fails in minutes, not at the job's timeout
      # the suites of the part of this runner, one target per line
      # (docs/adr/0140, docs/adr/0155)
      - name: The test suites of the runner (docs/adr/0140)
        if: matrix.tests
        timeout-minutes: 20
        env:
          SUITES: ${{ matrix.suites }}
          GOLEM_REQUIRE_EXTERNAL_TOOLS: "1"
          # the ten public-domain books are typeset to every target
          # (docs/adr/0026, docs/adr/0058)
          GOLEM_PD_BOOKS: "1"
          # a missing golden file fails instead of being written and
          # passing (tasty-golden's --no-create). The environment reaches
          # every suite; --test-options=--no-create would be rejected by
          # the suites without tasty-golden, and no cabal command here takes
          # a flag of the configuration (docs/adr/0037)
          TASTY_NO_CREATE: "true"
        run: |
          # each target is one word
          # shellcheck disable=SC2046
          cabal test $(sh scripts/ci/test-suites.sh "$SUITES")
      # golem-parser-test is not a suite of tests-driver
      - name: Generated parser matches the grammar
        if: matrix.tests && matrix.suites != 'driver'
        run: |
          scripts/gen-parser.sh
          git diff --exit-code modules/golem-parser/src/Golem/Parser/Generated.hs modules/golem-parser/test/StrippedGrammar.hs modules/golem-emet/src/Golem/Emet/Generated.hs
      # the modules that embed VERSION and docs/diagnostics.md in golem-driver
      # in place of Template Haskell (docs/adr/0203)
      - name: Generated modules match VERSION and docs/diagnostics.md
        if: matrix.tests && matrix.suites != 'driver'
        run: |
          sh scripts/gen-embedded.sh
          git diff --exit-code modules/golem-driver/src/Golem/Driver/Version/Embedded.hs modules/golem-driver/src/Golem/Driver/Explain/Embedded.hs
      - name: Cache the fonts of the manuals (docs/adr/0022, docs/adr/0024)
        if: matrix.outputs || matrix.env
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            manual/fonts
            manual-dev/fonts
          key: manual-fonts-${{ hashFiles('scripts/manual/fetch-fonts.sh') }}
      # the 17 PDFs of the visual regression test; the visual job renders
      # and compares them (docs/adr/0094, docs/adr/0095). They come first
      # of the outputs: build.sh copies every input to a directory of its
      # own and fetches the fonts of the manuals itself, and visual waits
      # for visual-pdfs alone (docs/adr/0099, docs/adr/0140)
      - name: The PDFs of the visual regression test (docs/adr/0095)
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        run: GOLEM="$(cabal list-bin -v0 golem)" sh scripts/visual/build.sh visual-pdfs
      - name: Upload the PDFs of the visual regression test
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-pdfs
          path: visual-pdfs
      # the PDFs, the diagnostics and the exit codes of the inputs of the
      # comparison with golem.wasm, which the job wasm waits for and
      # compares with its own list (docs/adr/0199)
      - name: The native list of the comparison with golem.wasm (docs/adr/0199)
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        run: sh scripts/wasm/compare.sh --native "$(cabal list-bin -v0 golem)" > wasm-native-list.txt
      - name: Upload the native list of the comparison with golem.wasm
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-native-list
          path: wasm-native-list.txt
      # the books that the job verapdf checks against PDF/A-2a and PDF/UA-1
      # (docs/adr/0183)
      - name: The PDFs that declare PDF/A-2a and PDF/UA-1 (docs/adr/0183)
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        run: GOLEM="$(cabal list-bin -v0 golem)" sh scripts/ci/conformance-pdfs.sh conformance-pdfs
      - name: Upload the PDFs that declare PDF/A-2a and PDF/UA-1
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-pdfs
          path: conformance-pdfs
      # the EPUB of aarch64 is the same, by the determinism job
      - name: The EPUB passes epubcheck
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        working-directory: modules/golem-driver/test/fixtures/sample
        run: |
          "$(cabal list-bin -v0 golem)" build --target epub
          epubcheck build/epub/book.epub
      # one @bibliography per chapter and per section: no id twice, no
      # broken link (golem-doc ADR 0008)
      - name: The EPUB of several bibliographies passes epubcheck
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        working-directory: modules/golem-driver/test/fixtures/bibliographies
        run: |
          "$(cabal list-bin -v0 golem)" build --target epub
          epubcheck build/epub/book.epub
      # [lang] and @lang give xml:lang and lang in the XHTML (docs/adr/0187)
      - name: The EPUB with languages passes epubcheck
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        working-directory: modules/golem-driver/test/fixtures/languages
        run: |
          "$(cabal list-bin -v0 golem)" build --target epub
          epubcheck build/epub/book.epub
      # a citation of @bibliography in another file, a navigation of depth
      # 1 and the channel of the sample plugin glossary, put in a cache by
      # the SHA-256 of plugins.lock so that its url is not fetched
      # (docs/adr/0232)
      - name: The EPUB of epub-forms passes epubcheck (docs/adr/0232)
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        working-directory: modules/golem-driver/test/fixtures/epub-forms
        run: |
          cache="$RUNNER_TEMP/epub-forms-cache"
          mkdir -p "$cache/golem/plugins"
          sha=$(sed -n 's/^sha256 = "\([0-9a-f]*\)"$/\1/p' plugins.lock)
          cp "$GITHUB_WORKSPACE/plugins/wasm/glossary.wasm" "$cache/golem/plugins/$sha.wasm"
          XDG_CACHE_HOME="$cache" "$(cabal list-bin -v0 golem)" build --target epub
          epubcheck build/epub/book.epub
      # scripts/determinism.sh builds the two manuals with
      # scripts/manual/build.sh, which fails on a single diagnostic,
      # notices included, and lists the hashes of their outputs; the
      # manuals are built once, here, on both architectures (docs/adr/0002,
      # docs/adr/0022, docs/adr/0024, docs/adr/0037)
      - name: Outputs for the determinism check; the manuals build without diagnostics
        if: matrix.outputs
        run: GOLEM="$(cabal list-bin -v0 golem)" scripts/determinism.sh > determinism-${{ matrix.runner }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.outputs
        with:
          name: determinism-${{ matrix.runner }}
          path: determinism-${{ matrix.runner }}.txt
      # the PDFs of the two manuals embed their fonts and have no spot
      # colour space, by golem preflight with the rules of CI; they use no
      # typeface but the fonts of their fonts/, by the BaseFonts the PDF
      # names (docs/adr/0232)
      - name: The preflight of the manuals (docs/adr/0232)
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        run: |
          GOLEM="$(cabal list-bin -v0 golem)"
          for project in manual manual-dev; do
            (cd "$project" && "$GOLEM" preflight --rules ../scripts/ci/manual-preflight.toml)
          done
      - name: The typefaces of the manuals are their fonts (docs/adr/0232)
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        run: |
          for project in manual manual-dev; do
            fonts=$(for f in "$project"/fonts/*.otf; do basename "$f" .otf; done)
            for pdf in "$project"/build/pdf/*.pdf; do
              # one font per word
              # shellcheck disable=SC2086
              sh scripts/ci/pdf-fonts.sh "$pdf" $fonts
            done
          done
      # the code the developer manual writes \| in its source shows |, in
      # the text pdftotext reads from its PDF (docs/adr/0233); the line of
      # 「[code: \|\|] の右辺」 ends after || since lines pull in first
      # (docs/adr/0274)
      - name: The bars of the code of the developer manual (docs/adr/0233)
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        run: |
          for pdf in manual-dev/build/pdf/*.pdf; do
            sh scripts/ci/pdf-text.sh "$pdf" \
              --has '次の行の最初が | 、' \
              --has 'と ||' \
              --has 'ガードの | の前' \
              --has '] 、 | 、 [ は \ で' \
              --lacks '\|'
          done
      # the outputs do not change with the time zone, the locale,
      # SOURCE_DATE_EPOCH, HOME, XDG_*, PATH, the umask, the path of the
      # project, the times of its files and files nothing refers to; the
      # changes take the same paths on both architectures (docs/adr/0029).
      # It runs on an x86-64 runner of its own, beside the outputs
      # (docs/adr/0097)
      - name: Japanese locales for the environment check
        if: matrix.env
        run: sudo locale-gen ja_JP.UTF-8 ja_JP.EUC-JP
      # the manuals are inputs of every input (not --quick); the runner of
      # the outputs fetches their fonts in scripts/manual/build.sh
      - name: The fonts of the manuals for the environment check
        if: matrix.env
        timeout-minutes: 5
        run: |
          sh scripts/manual/fetch-fonts.sh manual/fonts
          sh scripts/manual/fetch-fonts.sh manual-dev/fonts
      - name: The outputs do not change with the environment (docs/adr/0029, docs/adr/0038)
        if: matrix.env
        env:
          # pull requests check the small inputs; pushes to main and the
          # calls from release.yml check every input (docs/adr/0038)
          QUICK: ${{ github.event_name == 'pull_request' && '--quick' || '' }}
        run: |
          # QUICK is empty or one word
          # shellcheck disable=SC2086
          GOLEM_REQUIRE_LOCALES=1 GOLEM_REQUIRE_FONTS=1 GOLEM="$(cabal list-bin -v0 golem)" sh scripts/env-determinism/check.sh $QUICK
      # the PDF and the HTML of the manuals; those of aarch64 are the same,
      # by the determinism job (docs/adr/0022, docs/adr/0024)
      - name: The user manual (docs/adr/0022)
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manual
          path: |
            manual/build/pdf
            manual/build/html
      - name: The developer manual (docs/adr/0024)
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manual-dev
          path: |
            manual-dev/build/pdf
            manual-dev/build/html
      # pushes to main only, when GHC compiled a module: a pull request
      # restores the dist-newstyle of main and saves none, and a run that
      # compiled nothing would save what it restored under a new key. The
      # runner of matrix.save saves it: tests-driver on each architecture
      # (docs/adr/0045, docs/adr/0140, docs/adr/0155, docs/adr/0228)
      - name: Save dist-newstyle (docs/adr/0009)
        if: success() && matrix.save && steps.build.outputs.compiled == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist-newstyle
          key: dist-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}-${{ hashFiles('scripts/fetch-wasmtime.sh') }}-${{ github.sha }}

  # The PDF as a wasm reactor module (docs/adr/0199, docs/adr/0202):
  # golem-wasm built with the wasm GHC of ghc-wasm-meta (the 9.10 flavour,
  # scripts/fetch-ghc-wasm.sh), checked under the node:wasi of Node LTS,
  # and its PDFs and diagnostics compared with those of the native golem of
  # the x86-64 runner of the outputs, which uploads its list as
  # wasm-native-list. The toolchain, the cabal store and the index of the
  # wasm build are one cache; the native alex and happy, which toml-parser
  # needs on the PATH, another; dist-wasm a third, by commit
  wasm:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 75
    runs-on: ubuntu-24.04
    env:
      HOSTTOOLS: ${{ github.workspace }}/third_party/hosttools
      # the templates of the native alex and happy, which they read from
      # their data directories, kept in the cache of the host tools: a hit
      # has no cabal store of the native GHC (docs/adr/0243)
      alex_datadir: ${{ github.workspace }}/third_party/hosttools/alex-data
      happy_lib_datadir: ${{ github.workspace }}/third_party/hosttools/happy-lib-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: date +%s > "$RUNNER_TEMP/t0"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Image for the cache keys
        run: |
          test -n "$ImageOS"
          echo "ImageOS=$ImageOS" >> "$GITHUB_ENV"
      # alex 3.5.4.2 and happy 2.2 (the versions of cabal.project.freeze),
      # built with the native GHC: cabal finds them on the PATH when it
      # builds toml-parser for wasm (docs/adr/0202 section 2). A hit needs
      # no native GHC at all
      - id: hosttools
        name: Restore the native alex and happy (docs/adr/0202)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/hosttools
          key: hosttools-alex-3.5.4.2-happy-2.2-data-ghc-${{ env.GHC_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}
      - if: steps.hosttools.outputs.cache-hit != 'true'
        name: cabal's directory (docs/adr/0201)
        run: echo "CABAL_DIR=$HOME/.cabal" >> "$GITHUB_ENV"
      - if: steps.hosttools.outputs.cache-hit != 'true'
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
          cabal-update: true
      - if: steps.hosttools.outputs.cache-hit != 'true'
        name: The native alex and happy (docs/adr/0202)
        run: |
          mkdir -p "$HOSTTOOLS" "$RUNNER_TEMP/hosttools-src"
          cd "$RUNNER_TEMP/hosttools-src"
          cabal install alex-3.5.4.2 happy-2.2 --installdir="$HOSTTOOLS" --install-method=copy --overwrite-policy=always
          t=$(find "$HOME/.cabal/store" -path '*/alex-3.5.4.2-*/AlexTemplate.hs' | head -n 1)
          test -n "$t"
          cp -R "$(dirname "$t")" "$alex_datadir"
          t=$(find "$HOME/.cabal/store" -path '*/happy-lib-2.2-*/HappyTemplate.hs' | head -n 1)
          test -n "$t"
          cp -R "$(dirname "$t")" "$happy_lib_datadir"
      - name: The native alex and happy are those versions
        run: |
          "$HOSTTOOLS/alex" --version | grep -F 'Alex version 3.5.4.2'
          "$HOSTTOOLS/happy" --version | grep -F 'Happy Version 2.2'
          test -f "$alex_datadir/AlexTemplate.hs"
          test -f "$happy_lib_datadir/HappyTemplate.hs"
      - if: steps.hosttools.outputs.cache-hit != 'true'
        name: Save the native alex and happy
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/hosttools
          key: ${{ steps.hosttools.outputs.cache-primary-key }}
      # the toolchain (scripts/fetch-ghc-wasm.sh), with the cabal store and
      # the index of the wasm build in third_party/ghc-wasm/.cabal; a
      # change of the project or its freeze restores the store of the same
      # toolchain and saves a new one, after the build, whether or not it
      # succeeded, so that a failure of golem-wasm does not build the store
      # again
      - id: ghcwasm
        name: Restore the wasm toolchain and its cabal store (docs/adr/0199)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ghc-wasm
          key: ghc-wasm-${{ hashFiles('scripts/fetch-ghc-wasm.sh') }}-${{ hashFiles('cabal.project.wasm', 'cabal.project.wasm.freeze', 'scripts/fetch-wasm-packages.sh', 'scripts/wasm/patches/*') }}
          restore-keys: ghc-wasm-${{ hashFiles('scripts/fetch-ghc-wasm.sh') }}-
      # nothing is fetched when the cache has the VERSION of the script
      - name: The wasm toolchain (docs/adr/0199)
        run: timeout -k 10 900 sh scripts/fetch-ghc-wasm.sh
      - name: skylighting 0.15 patched (docs/adr/0202)
        timeout-minutes: 10
        run: sh scripts/fetch-wasm-packages.sh
      - name: The versions of Hackage are those of cabal.project.freeze (docs/adr/0199)
        run: sh scripts/ci/wasm-freeze.sh
      - name: The versions of the toolchain and of the boot packages
        run: |
          . third_party/ghc-wasm/env
          wasm32-wasi-ghc --version
          wasm32-wasi-clang --version | head -1
          wasm32-wasi-ghc-pkg list --global --simple-output
      - if: steps.ghcwasm.outputs.cache-hit != 'true'
        name: The Hackage index of the wasm build
        run: |
          . third_party/ghc-wasm/env
          wasm32-wasi-cabal update
      - name: Restore dist-wasm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist-wasm
          key: dist-wasm-${{ hashFiles('scripts/fetch-ghc-wasm.sh') }}-${{ hashFiles('cabal.project.wasm', 'cabal.project.wasm.freeze') }}-${{ github.sha }}
          restore-keys: dist-wasm-${{ hashFiles('scripts/fetch-ghc-wasm.sh') }}-${{ hashFiles('cabal.project.wasm', 'cabal.project.wasm.freeze') }}-
      - name: The setup-config of dist-wasm newer than the .cabal files (docs/adr/0147)
        run: |
          if [ -d dist-wasm ]; then find dist-wasm -name setup-config -exec touch {} +; fi
      - id: build
        name: golem.wasm (docs/adr/0199)
        shell: bash
        run: |
          . third_party/ghc-wasm/env
          export PATH="$HOSTTOOLS:$PATH"
          s=$(date +%s)
          wasm32-wasi-cabal --project-file=cabal.project.wasm --builddir=dist-wasm build -v1 exe:golem-wasm 2>&1 | tee "$RUNNER_TEMP/wasm-build.log"
          echo "the wasm build: $(( $(date +%s) - s )) s"
          cp "$(wasm32-wasi-cabal --project-file=cabal.project.wasm --builddir=dist-wasm list-bin -v0 exe:golem-wasm)" golem.wasm
          ls -l golem.wasm
          if grep -qE '^\[ *[0-9]+ of [0-9]+\] Compiling ' "$RUNNER_TEMP/wasm-build.log"; then echo "compiled=true" >> "$GITHUB_OUTPUT"; fi
      # Node validates golem.wasm with and without the legacy exception
      # handling of V8; browsers and wasmtime read the standard one alone
      # (docs/adr/0238 section 2, I1)
      - name: golem.wasm has no instruction of the legacy exception handling (docs/adr/0238)
        run: sh scripts/wasm/legacy-eh.sh golem.wasm
      - name: Save the wasm toolchain and its cabal store
        if: always() && steps.ghcwasm.outputs.cache-hit != 'true' && steps.build.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ghc-wasm
          key: ${{ steps.ghcwasm.outputs.cache-primary-key }}
      # cabal 3.14 plans and builds the build-tool-depends alex and happy
      # of the packages with the wasm GHC too: their executables in
      # the store are wasm modules (alex.wasm, happy.wasm), which cabal does
      # not take for alex and happy and which cannot run here, so the lexer
      # and the parser of toml-parser come from the native alex and happy on
      # the PATH, of the versions of cabal.project.freeze
      - name: The build tools in the wasm store are wasm, not run (docs/adr/0202)
        run: |
          find third_party/ghc-wasm/.cabal/store -path '*/bin/*' -type f
          found=0
          for f in $(find third_party/ghc-wasm/.cabal/store -path '*/bin/*' \( -name 'alex*' -o -name 'happy*' \)); do
            found=$((found + 1))
            test "$(od -An -tx1 -N4 "$f" | tr -d ' ')" = 0061736d
            echo "$f: a wasm module"
          done
          test "$found" = 2
      # only a push to main saves dist-wasm; a pull request restores the
      # one of main and builds the packages it changed, without saving
      # (docs/adr/0219)
      - name: Save dist-wasm
        if: steps.build.outputs.compiled == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist-wasm
          key: dist-wasm-${{ hashFiles('scripts/fetch-ghc-wasm.sh') }}-${{ hashFiles('cabal.project.wasm', 'cabal.project.wasm.freeze') }}-${{ github.sha }}
      # the exports and the imports, an input it cannot read, a manifest
      # with [plugins], and the same bytes again in one instance and in a
      # new one (docs/adr/0199)
      - name: The checks of golem.wasm under node:wasi (docs/adr/0199)
        run: node scripts/wasm/run.mjs check golem.wasm modules/golem-driver/test/fixtures/kanikosen
      - name: The PDFs and the diagnostics of golem.wasm (docs/adr/0199)
        run: sh scripts/wasm/compare.sh golem.wasm > wasm-list.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golem-wasm
          path: |
            golem.wasm
            wasm-list.txt
      - name: Wait for the native list of the outputs runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: timeout -k 10 3600 sh scripts/visual/wait-pdfs.sh "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" 'build (ubuntu-24.04, outputs)' wasm-native-list
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-native-list
      - name: The PDFs and the diagnostics of golem.wasm are those of golem (docs/adr/0199, docs/adr/0238 I2)
        run: sh scripts/wasm/compare.sh --check wasm-native-list.txt wasm-list.txt
      # why the toolchain cache missed: the toolchain or the project
      # differs from main (the base of a pull request, the commit before a
      # push), or neither and the cache was evicted, a warning annotation
      # that does not fail the job (docs/adr/0219)
      - name: Times
        if: always()
        env:
          HIT: ${{ steps.ghcwasm.outputs.cache-hit }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          echo "the wasm job: $(( $(date +%s) - $(cat "$RUNNER_TEMP/t0") )) s"
          [ "$HIT" = true ] || HIT=false
          if [ -n "$BASE_SHA" ] && git fetch -q --depth=1 origin "$BASE_SHA"; then
            same() { if git diff --quiet FETCH_HEAD HEAD -- "$@"; then echo true; else echo false; fi; }
            sh scripts/ci/wasm-cache.sh "$HIT" "$(same scripts/fetch-ghc-wasm.sh)" "$(same cabal.project.wasm cabal.project.wasm.freeze scripts/fetch-wasm-packages.sh scripts/wasm/patches)"
          else
            echo "wasm-cache: the commit of main to compare with cannot be fetched; why the cache missed is not known"
          fi

  determinism:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: determinism-*
          merge-multiple: true
      - name: Outputs are byte-identical on x86-64 and aarch64
        run: diff determinism-ubuntu-24.04.txt determinism-ubuntu-24.04-arm.txt
      # the outputs but the manuals are those of the committed list; a pull
      # request that changes the outputs on purpose writes the list again,
      # with scripts/determinism.sh --no-manuals (docs/adr/0173)
      - name: Outputs are those of scripts/determinism/hashes.txt (docs/adr/0173)
        run: sh scripts/ci/determinism-hashes.sh determinism-ubuntu-24.04.txt scripts/determinism/hashes.txt

  # The visual regression test: the pages of the PDFs that the x86-64 runner
  # of the outputs built, rendered by shem at 72 dpi, against the references
  # of scripts/visual/pages (docs/adr/0093, docs/adr/0094, docs/adr/0095).
  # It compares with the committed references, not between architectures,
  # so it is a job of its own beside determinism
  #
  # It needs only changes: it starts with build, and waits for the artifact
  # visual-pdfs of the outputs runner instead of the whole build matrix
  # (docs/adr/0099). The waiting has a limit of 60 minutes, for a build
  # without a cache
  visual:
    needs: [changes]
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 75
    runs-on: ubuntu-24.04
    # actions: read for the artifact visual-pdfs of an earlier run, in the
    # report of a failure; this job only (docs/adr/0035, docs/adr/0096)
    permissions:
      contents: read
      actions: read
    steps:
      # the whole history, for the first-parent ancestors of the base and
      # its references (docs/adr/0096)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # the version and the SHA-256 are in fetch-shem.sh, so a new version
      # is a new key (docs/adr/0093)
      # the archive of shem, from the cache of main, is checked by its SHA-256
      # before it is unpacked (docs/adr/0243)
      - id: downloads
        name: Restore the archives of the downloads (docs/adr/0243)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/downloads
          key: downloads-visual-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/visual/fetch-shem.sh') }}
      # the retries of scripts/ci/fetch-url.sh take 7 minutes at the most
      - name: shem (docs/adr/0093)
        timeout-minutes: 10
        run: sh scripts/visual/fetch-shem.sh
      # a push to main saves the archives it fetched (docs/adr/0228, docs/adr/0243)
      - name: Save the archives of the downloads (docs/adr/0243)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      # visual-pdfs of this run, once the outputs runner has uploaded it; a
      # failed outputs runner fails this step (docs/adr/0099)
      - name: Wait for the PDFs of the visual regression test (docs/adr/0099)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: timeout -k 10 3600 sh scripts/visual/wait-pdfs.sh "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" 'build (ubuntu-24.04, outputs)'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: visual-pdfs
          path: visual-pdfs
      # the limit only finds a shem that does not stop; the budget is 2
      # minutes, and a run over it does not fail (docs/adr/0095). --lists
      # keeps the references of these PDFs for the report (docs/adr/0096)
      - id: check
        name: The pages match the references (docs/adr/0094, docs/adr/0095)
        shell: bash
        run: timeout -k 10 600 sh scripts/visual/check.sh --lists "$RUNNER_TEMP/visual-diff/pages" visual-pdfs | tee "$RUNNER_TEMP/visual.txt"
      # only when the pages differ: the images before and after of the
      # changed pages, their differences and the job summary. Before is the
      # base of the pull request, or the commit before the push to main;
      # called from release.yml there is none (docs/adr/0096)
      - name: Report of the changed pages (docs/adr/0096)
        if: failure() && steps.check.outcome == 'failure'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before || '') }}
        run: sh scripts/visual/report.sh "$RUNNER_TEMP/visual.txt" visual-pdfs "$RUNNER_TEMP/visual-diff" ${BASE:+"$BASE"} >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report of the changed pages (docs/adr/0096)
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: ${{ runner.temp }}/visual-diff

  release-scripts:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: VERSION matches the version of every package (docs/adr/0004)
        run: sh scripts/release/check-version.sh
      # the pinned Claude Code of mise.toml, as in the notes job of
      # release.yml, for the check of claude --help; no API key
      # (docs/adr/0044, docs/adr/0058)
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        with:
          cache: false
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}
      - name: Tests of the release scripts (docs/adr/0004)
        env:
          GOLEM_REQUIRE_CLAUDE: "1"
        run: sh scripts/release/test.sh

  # The tests of the scripts again on macOS, with the BSD awk, sed, find and
  # grep of the system: the scripts must run with the tools of the machine
  # that runs them, and nothing else checks the BSD ones (docs/adr/0079).
  # jq is in /usr/bin since macOS 15; the claude --help check is skipped
  # here, release-scripts requires it
  scripts-macos:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 15
    runs-on: macos-15
    env:
      PATH: /usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the six tests at the same time on the cores of the runner; the
      # output of each comes after a line with its name, its exit code and
      # its seconds, and any failure fails the step
      - name: Tests of the scripts (CI, manuals, environment check, release, by hand, visual regression test)
        run: sh scripts/ci/run-all.sh -t 600 scripts/ci/test.sh scripts/manual/test.sh scripts/env-determinism/test.sh scripts/release/test.sh scripts/test.sh scripts/visual/test.sh

  format:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: haskell-actions/run-fourmolu@1b9df64b784203126500372730b9725c97e4040b # v13
        with:
          version: "0.21.0.0"
          pattern: |
            modules/**/*.hs
            !modules/golem-parser/src/Golem/Parser/Generated.hs
            !modules/golem-parser/test/StrippedGrammar.hs
            !modules/golem-emet/src/Golem/Emet/Generated.hs
            !modules/golem-driver/src/Golem/Driver/Version/Embedded.hs
            !modules/golem-driver/src/Golem/Driver/Explain/Embedded.hs
      # the archives of the downloads, from the cache of main; each is checked
      # by its SHA-256 before it is used (docs/adr/0243)
      - id: downloads
        name: Restore the archives of the downloads (docs/adr/0243)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/downloads
          key: downloads-format-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/fetch-hlint.sh') }}
      # the release of hlint, not a build of it with GHC (docs/adr/0009); the
      # retries of scripts/ci/fetch-url.sh take 7 minutes at the most
      - name: hlint 3.10
        timeout-minutes: 10
        run: sh scripts/ci/fetch-hlint.sh
      # a push to main saves the archives it fetched (docs/adr/0228, docs/adr/0243)
      - name: Save the archives of the downloads (docs/adr/0243)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      # -j checks the files on every core of the runner (docs/adr/0037)
      - run: '"$HOME/.local/bin/hlint" -j modules --ignore-glob="modules/golem-parser/src/Golem/Parser/Generated.hs" --ignore-glob="modules/golem-parser/test/StrippedGrammar.hs" --ignore-glob="modules/golem-emet/src/Golem/Emet/Generated.hs" --ignore-glob="modules/golem-driver/src/Golem/Driver/Version/Embedded.hs" --ignore-glob="modules/golem-driver/src/Golem/Driver/Explain/Embedded.hs"'

  # The sample plugins and their helper crate (docs/adr/0106): the tests of
  # the crates, and the committed plugins/wasm/*.wasm are the bytes the
  # sources build with the toolchain of plugins/rust-toolchain.toml, which
  # rustup installs on the first cargo there
  plugins:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: plugins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests of the crates
        run: cargo test --locked
      # the ids of the crates do not name the host (docs/adr/0138)
      - name: Tests of the rustc wrapper
        run: sh rustc-wrapper-test.sh
      - name: The committed plugins are what the sources build
        run: sh build.sh --check
      # licenses/plugins/ is what the sources and the toolchain give; the
      # build above fetched the sources of the crates, so it uses no network
      # (docs/adr/0133)
      - name: The license documents of the plugins are up to date
        run: sh ../scripts/plugin-licenses.sh --check

  # The editor grammars of .gm and .emet in tools/editors/ (docs/adr/0170):
  # tree-sitter and vscode-tmgrammar-test at the versions of its
  # package-lock.json, the generated parsers, the tests of both kinds of
  # grammars on the same samples, and a parse of every .gm and .emet of the
  # fixtures and the manuals. Never skipped: a change of a manual alone can
  # break the parse
  editors:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      # node_modules itself is cached; test.sh checks the SHA-256 of the
      # executable of tree-sitter, also when it comes from the cache
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/editors/node_modules
          key: editors-${{ runner.os }}-${{ hashFiles('tools/editors/package-lock.json') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci --prefix tools/editors --no-fund --no-audit
      - name: Tests of the editor grammars (docs/adr/0170)
        run: sh tools/editors/test.sh
      # the version and the SHA-256 of Helix are in its test.sh, so a new
      # version is a new key (docs/adr/0231)
      - id: downloads
        name: Restore the archives of the downloads (docs/adr/0243)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/downloads
          key: downloads-editors-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/editors/helix/test.sh') }}
      # the retries of scripts/ci/fetch-url.sh take 7 minutes at the most, and
      # the tests a minute
      - name: The grammars in Helix, by the README (docs/adr/0231)
        timeout-minutes: 15
        run: sh tools/editors/helix/test.sh
      # a push to main saves the archives it fetched (docs/adr/0228, docs/adr/0243)
      - name: Save the archives of the downloads (docs/adr/0243)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}

  # golem lsp and the editor grammars in a headless Neovim (docs/adr/0231):
  # the tests of tools/editors/nvim/test.sh and its self-test, with Neovim
  # pinned by tools/editors/fetch-nvim.sh. It needs only changes, and waits
  # for the artifact golem-linux-x86_64 of the outputs runner instead of
  # the whole build matrix, as visual does (docs/adr/0099)
  editors-lsp:
    needs: [changes]
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 75
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the version and the SHA-256 are in fetch-nvim.sh, so a new version
      # is a new key
      - id: downloads
        name: Restore the archives of the downloads (docs/adr/0243)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/downloads
          key: downloads-editors-lsp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/editors/fetch-nvim.sh') }}
      # the retries of scripts/ci/fetch-url.sh take 7 minutes at the most
      - name: Neovim (docs/adr/0231)
        timeout-minutes: 10
        run: sh tools/editors/fetch-nvim.sh
      # a push to main saves the archives it fetched (docs/adr/0228, docs/adr/0243)
      - name: Save the archives of the downloads (docs/adr/0243)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Wait for golem of the outputs runner (docs/adr/0231)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: timeout -k 10 3600 sh scripts/visual/wait-pdfs.sh "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" 'build (ubuntu-24.04, outputs)' golem-linux-x86_64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: golem-linux-x86_64
          path: golem-linux-x86_64
      # an artifact keeps no mode of its files
      - run: chmod +x golem-linux-x86_64/golem
      - name: golem lsp in a headless Neovim (docs/adr/0231)
        timeout-minutes: 10
        run: GOLEM="$PWD/golem-linux-x86_64/golem" NVIM="$PWD/third_party/nvim/bin/nvim" sh tools/editors/nvim/test.sh
      # each test fails with its one marked expectation inverted
      - name: The tests fail when inverted (docs/adr/0231)
        timeout-minutes: 10
        run: GOLEM="$PWD/golem-linux-x86_64/golem" NVIM="$PWD/third_party/nvim/bin/nvim" sh tools/editors/nvim/test.sh --self-test

  # veraPDF checks the PDFs of conformance-pdfs against PDF/A-2a and
  # PDF/UA-1 (docs/adr/0183). veraPDF comes from nixpkgs at a fixed commit,
  # from the signed cache of cache.nixos.org, and must be the store path of
  # VERAPDF_STORE_PATH; the Nix store is not cached. As visual, it waits
  # for its artifact of the outputs runner, not for the whole of build, and
  # installs Nix and veraPDF while it waits, so that it is off the critical
  # path of CI (docs/adr/0244)
  verapdf:
    needs: [changes]
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 75
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # nixpkgs comes from api.github.com with the token of the job, under
      # the rate limit of an authenticated request (docs/adr/0243)
      - name: veraPDF from nixpkgs, at the store path of VERAPDF_STORE_PATH
        env:
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
        run: |
          out=$(nix build --no-link --print-out-paths "github:NixOS/nixpkgs/$VERAPDF_NIXPKGS_REV#verapdf")
          if [ "$out" != "$VERAPDF_STORE_PATH" ]; then
            echo "veraPDF is $out, not $VERAPDF_STORE_PATH" >&2
            exit 1
          fi
      # fails when the outputs runner ended without conformance-pdfs
      - name: Wait for conformance-pdfs of the outputs runner (docs/adr/0244)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: timeout -k 10 3600 sh scripts/visual/wait-pdfs.sh "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" 'build (ubuntu-24.04, outputs)' conformance-pdfs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-pdfs
          path: conformance-pdfs
      - name: The PDFs pass PDF/A-2a and PDF/UA-1
        run: sh scripts/ci/verapdf.sh "$VERAPDF_STORE_PATH/bin/verapdf" conformance-pdfs

  # The stale dist- caches of main, after the saves of build and wasm, so
  # that the caches of the repository stay under the limit of 10 GB: the
  # newest of each family of the current keys (the dist-newstyle of x86-64
  # and of aarch64, and dist-wasm) is kept, and the other dist- caches of
  # main are deleted (scripts/ci/stale-dist-caches.sh). The one job with a
  # write permission (the actions scope, to delete caches); it runs on pushes to
  # main only, builds and tests nothing, and ci does not need it: a cache
  # it failed to delete goes at the next push (docs/adr/0228)
  caches:
    needs: [changes, build, wasm]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Delete the stale dist- caches of main (docs/adr/0228)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # the keys of the saves of build and wasm without the commit hash
          X64: dist-Linux-X64-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}-${{ hashFiles('scripts/fetch-wasmtime.sh') }}-
          ARM64: dist-Linux-ARM64-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}-${{ hashFiles('scripts/fetch-wasmtime.sh') }}-
          WASM: dist-wasm-${{ hashFiles('scripts/fetch-ghc-wasm.sh') }}-${{ hashFiles('cabal.project.wasm', 'cabal.project.wasm.freeze') }}-
        run: |
          set -eu
          usage() { gh api 'repos/{owner}/{repo}/actions/cache/usage' --jq '"\(.active_caches_size_in_bytes) bytes in \(.active_caches_count) caches"'; }
          BEFORE=$(usage)
          gh cache list --ref refs/heads/main --key dist- --limit 100 --json id,key,createdAt --jq '.[] | [.id, .createdAt, .key] | @tsv' > "$RUNNER_TEMP/dist-caches.tsv"
          sh scripts/ci/stale-dist-caches.sh "$X64" "$ARM64" "$WASM" < "$RUNNER_TEMP/dist-caches.tsv" > "$RUNNER_TEMP/stale.txt"
          {
            echo "## The stale dist- caches of main (docs/adr/0228)"
            echo
            echo "Before: $BEFORE"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r id; do
            key=$(awk -F '\t' -v id="$id" '$1 == id { print $3 }' "$RUNNER_TEMP/dist-caches.tsv")
            gh cache delete "$id" < /dev/null
            echo "Deleted $id $key"
            echo "- deleted \`$key\` ($id)" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/stale.txt"
          if [ ! -s "$RUNNER_TEMP/stale.txt" ]; then echo "- nothing to delete" >> "$GITHUB_STEP_SUMMARY"; fi
          # the usage of the API is updated about every five minutes, and
          # may not show the deletions yet
          {
            echo
            echo "After: $(usage)"
          } >> "$GITHUB_STEP_SUMMARY"

  parser-fmt-manuscripts:
    needs: [changes, build]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: golem-linux-x86_64
          path: golem-linux-x86_64
      - name: Check manuscript round trips with the candidate CLI
        timeout-minutes: 10
        run: |
          chmod +x golem-linux-x86_64/golem
          node --test experiments/parser-fmt-proof/manuscripts/*.test.mjs
          GOLEM="$PWD/golem-linux-x86_64/golem" node experiments/parser-fmt-proof/manuscripts/check.mjs 2
      - name: Save failing manuscripts and replay commands
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parser-fmt-manuscript-failures
          path: round-trip-failures
          if-no-files-found: ignore

  parser-fmt-proofs:
    needs: [changes]
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/parser-fmt-proofs.yml

  # The one check of ci.yml that the protection of main requires: every job
  # succeeded, or was skipped for a change of documents only (docs/adr/0021)
  # the logs of the other jobs of the run are read for warnings, which
  # needs actions: read (docs/adr/0245)
  ci:
    needs: [changes, scripts-linux, build, determinism, visual, release-scripts, scripts-macos, format, plugins, editors, editors-lsp, verapdf, wasm, parser-fmt-proofs, parser-fmt-manuscripts]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Results of the jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$NEEDS" | sh scripts/ci/gate.sh
      # every job of the run that has ended, but those skipped; ci itself
      # is still running. The list of jobs comes from gh api, and each log,
      # which may hold terminal escape sequences that gh api refuses to
      # write, from the same API with curl (docs/adr/0245 section 6)
      - name: No warning in the logs of the jobs but the allowed ones (docs/adr/0245)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.status == "completed" and .conclusion != "skipped") | [.id, .name] | @tsv' >"$RUNNER_TEMP/jobs.tsv"
          cat "$RUNNER_TEMP/jobs.tsv"
          while IFS="$(printf '\t')" read -r id name; do
            curl -fsSL --retry 5 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" -o "$RUNNER_TEMP/logs/$id.log"
          done <"$RUNNER_TEMP/jobs.tsv"
          test -s "$RUNNER_TEMP/jobs.tsv"
          sh scripts/ci/log-warnings.sh scripts/ci/warnings-allowed.tsv "$RUNNER_TEMP"/logs/*.log
