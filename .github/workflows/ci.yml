name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs the same build, tests and determinism check before a
  # release (docs/adr/0004)
  workflow_call:

# The jobs only read the repository; caches and artifacts need no token
# scope (docs/adr/0035)
permissions:
  contents: read

# A new push to a pull request cancels its running checks; pushes to main and
# calls from release.yml each get a group of their own, so that every commit
# of main is checked (docs/adr/0009)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # written once, for haskell-actions/setup and the cache keys (docs/adr/0009)
  GHC_VERSION: "9.10.3"
  CDDL_VERSION: "0.10.7"

jobs:
  # Whether the change needs the build and the checks: not when it touches
  # only docs/ and the Markdown files at the root (docs/adr/0009)
  changes:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tests of the CI scripts (docs/adr/0009)
        run: sh scripts/ci/test.sh
      - name: Tests of the scripts of the manuals (docs/adr/0022, docs/adr/0024)
        run: sh scripts/manual/test.sh
      - name: Tests of the environment check (docs/adr/0029)
        run: sh scripts/env-determinism/test.sh
      - name: The documents that the build reads are listed (docs/adr/0021)
        run: sh scripts/ci/docs-refs.sh
      - name: Every package errors on incomplete patterns (docs/adr/0027)
        run: sh scripts/ci/incomplete-patterns.sh
      - name: The uses of unsafePerformIO are the listed ones (docs/adr/0034)
        run: sh scripts/ci/unsafe-io.sh
      - name: No program changes its number of capabilities while it runs
        run: sh scripts/ci/rts-capabilities.sh
      - id: decide
        name: Paths of the change
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # a pull request from its merge base, a push to main from the
          # commit before; called from release.yml (a tag push or
          # workflow_dispatch) there is no range, and everything is built
          # (docs/adr/0021)
          case "$EVENT" in
            pull_request) BASE=$PR_BASE HEAD=$PR_HEAD ;;
            push) if [ "$GITHUB_REF" = refs/heads/main ]; then BASE=$BEFORE HEAD=$GITHUB_SHA; else BASE= HEAD=; fi ;;
            *) BASE= HEAD= ;;
          esac
          if PATHS=$(sh scripts/ci/changed-paths.sh "$EVENT" "$BASE" "$HEAD"); then
            printf '%s\n' "$PATHS"
            BUILD=$(printf '%s\n' "$PATHS" | sh scripts/ci/needs-build.sh)
          else
            BUILD=true
          fi
          echo "build=$BUILD"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 30
    # On x86-64, two runners build the same commit: one runs the tests,
    # the other makes the outputs (the determinism check, the manuals,
    # epubcheck and the environment check). The work is bound by the four
    # cores of a runner, and the x86-64 build is the longest job; on
    # aarch64 one runner does both (docs/adr/0045)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            part: tests
            tests: true
            outputs: false
          - runner: ubuntu-24.04
            part: outputs
            tests: false
            outputs: true
          - runner: ubuntu-24.04-arm
            part: all
            tests: true
            outputs: true
    name: build (${{ matrix.runner }}, ${{ matrix.part }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # apt-get takes about 20 seconds; it runs while the caches are
      # restored and cabal builds, and the step before the tests waits for
      # it. A stalled mirror fails it in 5 minutes (docs/adr/0009,
      # docs/adr/0037)
      # the tests need qpdf, and epubcheck checks the EPUB of x86-64
      - name: qpdf, and epubcheck on x86-64, in the background (golem-pdf ADR 0001, golem-epub ADR 0001)
        env:
          PACKAGES: ${{ matrix.runner == 'ubuntu-24.04' && matrix.outputs && 'epubcheck' || 'qpdf' }}
        run: |
          # PACKAGES is a list of package names
          # shellcheck disable=SC2086
          sh scripts/ci/bg.sh start apt timeout -k 10 300 sh scripts/ci/apt-install.sh $PACKAGES
      # Every cabal command below reads the test wrapper from
      # cabal.project.local. Given on the command line of cabal test
      # alone, it changed the configuration of the local packages between
      # cabal build and cabal test, so that each of them configured every
      # package again, and golem-font compiled HarfBuzz again (docs/adr/0037)
      - name: The test wrapper for every cabal command (docs/adr/0037)
        run: |
          printf -- '-- written by ci.yml (docs/adr/0037)\ntest-wrapper: %s/scripts/ci/suite-timeout.sh\n' "$PWD" >> cabal.project.local
      - name: Image and GHC directory for the cache keys (docs/adr/0009)
        run: |
          # ImageOS is set on the runner, not in the env context
          test -n "$ImageOS"
          echo "ImageOS=$ImageOS" >> "$GITHUB_ENV"
          # ghcup installs into $GHCUP_INSTALL_BASE_PREFIX/.ghcup, which is
          # /usr/local on x86-64 and unset (so $HOME) on aarch64
          echo "GHC_DIR=${GHCUP_INSTALL_BASE_PREFIX:-$HOME}/.ghcup/ghc/$GHC_VERSION" >> "$GITHUB_ENV"
      - name: Cache GHC (docs/adr/0009)
        uses: actions/cache@v6
        with:
          path: ${{ env.GHC_DIR }}
          key: ghc-${{ env.GHC_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}
      - id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: "3.16.1.0"
          cabal-update: false
      - name: GHC on the PATH (docs/adr/0009)
        # On a cache hit of GHC, ghcup skips the install and does not link
        # ghc-$GHC_VERSION into its bin directory, so cabal (with-compiler:
        # ghc-9.10.3) finds it in the GHC directory itself
        run: |
          if [ ! -x "$GHC_DIR/bin/ghc-$GHC_VERSION" ]; then
            test -x "$GHC_DIR/bin/ghc"
            ln -s ghc "$GHC_DIR/bin/ghc-$GHC_VERSION"
          fi
          echo "$GHC_DIR/bin" >> "$GITHUB_PATH"
      - id: index
        name: Cache the Hackage index (docs/adr/0009)
        uses: actions/cache@v6
        with:
          path: ~/.cabal/packages/hackage.haskell.org
          key: hackage-index-${{ hashFiles('cabal.project.freeze') }}
      - if: steps.index.outputs.cache-hit != 'true'
        run: cabal update
      - name: Cache the cabal store
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-store-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}
          restore-keys: cabal-store-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-
      - name: Restore dist-newstyle (docs/adr/0009)
        uses: actions/cache/restore@v6
        with:
          path: dist-newstyle
          key: dist-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}-${{ github.sha }}
          restore-keys: dist-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}-
      - name: wasmtime C API (golem-plugin ADR 0001)
        run: scripts/fetch-wasmtime.sh
      - id: cddl
        name: Cache the cddl CLI (docs/adr/0009)
        if: matrix.tests
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cddl
          key: cddl-${{ env.CDDL_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}
      - name: cddl CLI for the schema test (golem-doc ADR 0001)
        if: matrix.tests && steps.cddl.outputs.cache-hit != 'true'
        run: cargo install cddl --version "$CDDL_VERSION" --locked
      # peg-cli is built with the rest, for the check of the generated
      # parser. compiled is true when GHC compiled a module, that is, when
      # dist-newstyle is no longer the one restored above (docs/adr/0045)
      - id: build
        name: cabal build all peg-cli:exe:peg-hs
        shell: bash
        run: |
          cabal build all peg-cli:exe:peg-hs 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -qE '^\[ *[0-9]+ of [0-9]+\] Compiling ' "$RUNNER_TEMP/build.log"; then COMPILED=true; else COMPILED=false; fi
          echo "compiled=$COMPILED" >> "$GITHUB_OUTPUT"
      # in the plan of the build above, no library nor executable depends
      # on golem-test-support, which only the test suites use (docs/adr/0028)
      - name: Only the test suites depend on golem-test-support (docs/adr/0028)
        run: sh scripts/ci/test-only-deps.sh dist-newstyle/cache/plan.json
      - name: qpdf, and epubcheck on x86-64, are installed
        timeout-minutes: 5
        run: sh scripts/ci/bg.sh wait apt
      # qpdf, cddl and openssl are installed above (openssl comes with the
      # runner image): a test that needs one of them fails here instead of
      # being skipped. A suite that does not finish in 10 minutes is
      # stopped and fails (the test wrapper scripts/ci/suite-timeout.sh in
      # cabal.project.local); the step itself stops after 20, so that a
      # hang fails in minutes, not at the job's timeout
      - run: cabal test all
        if: matrix.tests
        timeout-minutes: 20
        env:
          GOLEM_REQUIRE_EXTERNAL_TOOLS: "1"
      - name: Generated parser matches the grammar
        if: matrix.tests
        run: |
          scripts/gen-parser.sh
          git diff --exit-code modules/golem-parser/src/Golem/Parser/Generated.hs modules/golem-parser/test/StrippedGrammar.hs
      - name: Cache the fonts of the manuals (docs/adr/0022, docs/adr/0024)
        if: matrix.outputs
        uses: actions/cache@v6
        with:
          path: |
            manual/fonts
            manual-dev/fonts
          key: manual-fonts-${{ hashFiles('scripts/manual/fetch-fonts.sh') }}
      # the EPUB of aarch64 is the same, by the determinism job
      - name: The EPUB passes epubcheck
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        working-directory: modules/golem-driver/test/fixtures/sample
        run: |
          "$(cabal list-bin -v0 golem)" build --target epub
          epubcheck build/epub/book.epub
      # scripts/determinism.sh builds the two manuals with
      # scripts/manual/build.sh, which fails on a single diagnostic,
      # notices included, and lists the hashes of their outputs; the
      # manuals are built once, here, on both architectures (docs/adr/0002,
      # docs/adr/0022, docs/adr/0024, docs/adr/0037)
      - name: Outputs for the determinism check; the manuals build without diagnostics
        if: matrix.outputs
        run: GOLEM="$(cabal list-bin -v0 golem)" scripts/determinism.sh > determinism-${{ matrix.runner }}.txt
      - uses: actions/upload-artifact@v7
        if: matrix.outputs
        with:
          name: determinism-${{ matrix.runner }}
          path: determinism-${{ matrix.runner }}.txt
      # the outputs do not change with the time zone, the locale,
      # SOURCE_DATE_EPOCH, HOME, XDG_*, PATH, the umask, the path of the
      # project, the times of its files and files nothing refers to; the
      # changes take the same paths on both architectures (docs/adr/0029)
      - name: Japanese locales for the environment check
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        run: sudo locale-gen ja_JP.UTF-8 ja_JP.EUC-JP
      - name: The outputs do not change with the environment (docs/adr/0029, docs/adr/0038)
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        env:
          # pull requests check the small inputs; pushes to main and the
          # calls from release.yml check every input (docs/adr/0038)
          QUICK: ${{ github.event_name == 'pull_request' && '--quick' || '' }}
        run: |
          # QUICK is empty or one word
          # shellcheck disable=SC2086
          GOLEM_REQUIRE_LOCALES=1 GOLEM_REQUIRE_FONTS=1 GOLEM="$(cabal list-bin -v0 golem)" sh scripts/env-determinism/check.sh $QUICK
      # the PDF and the HTML of the manuals; those of aarch64 are the same,
      # by the determinism job (docs/adr/0022, docs/adr/0024)
      - name: The user manual (docs/adr/0022)
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        uses: actions/upload-artifact@v7
        with:
          name: manual
          path: |
            manual/build/pdf
            manual/build/html
      - name: The developer manual (docs/adr/0024)
        if: matrix.runner == 'ubuntu-24.04' && matrix.outputs
        uses: actions/upload-artifact@v7
        with:
          name: manual-dev
          path: |
            manual-dev/build/pdf
            manual-dev/build/html
      # pushes to main only: a pull request's cache would serve that pull
      # request alone, under a key that changes with every commit. On
      # x86-64 the runner of the tests saves it (docs/adr/0045)
      - name: Save dist-newstyle (docs/adr/0009)
        if: success() && matrix.tests && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: dist-newstyle
          key: dist-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}-${{ github.sha }}
      # A pull request saves its own dist-newstyle when cabal build has
      # compiled something, even when a later step fails, so that its next
      # push or a rerun builds on it. Restore dist-newstyle above looks in
      # the caches of the pull request first and then in those of main
      # (docs/adr/0045)
      - name: Save dist-newstyle of the pull request (docs/adr/0045)
        if: always() && matrix.tests && steps.build.outcome == 'success' && steps.build.outputs.compiled == 'true' && github.event_name == 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: dist-newstyle
          key: dist-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}-pr-${{ github.event.pull_request.number }}-${{ github.sha }}-${{ github.run_attempt }}

  determinism:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: determinism-*
          merge-multiple: true
      - name: Outputs are byte-identical on x86-64 and aarch64
        run: diff determinism-ubuntu-24.04.txt determinism-ubuntu-24.04-arm.txt

  release-scripts:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: VERSION matches the version of every package (docs/adr/0004)
        run: sh scripts/release/check-version.sh
      - name: Tests of the release scripts (docs/adr/0004)
        run: sh scripts/release/test.sh

  format:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: haskell-actions/run-fourmolu@v13
        with:
          version: "0.21.0.0"
          pattern: |
            modules/**/*.hs
            !modules/golem-parser/src/Golem/Parser/Generated.hs
            !modules/golem-parser/test/StrippedGrammar.hs
      # the release of hlint, not a build of it with GHC (docs/adr/0009)
      - name: hlint 3.10
        run: sh scripts/ci/fetch-hlint.sh
      # -j checks the files on every core of the runner (docs/adr/0037)
      - run: '"$HOME/.local/bin/hlint" -j modules --ignore-glob="modules/golem-parser/src/Golem/Parser/Generated.hs" --ignore-glob="modules/golem-parser/test/StrippedGrammar.hs"'

  # The one check of ci.yml that the protection of main requires: every job
  # succeeded, or was skipped for a change of documents only (docs/adr/0021)
  ci:
    needs: [changes, build, determinism, release-scripts, format]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Results of the jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$NEEDS" | sh scripts/ci/gate.sh
