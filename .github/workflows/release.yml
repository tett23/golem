# Builds, checks and publishes as a draft the release archives of golem
# (docs/adr/0004-binary-distribution-and-release.md). A v* tag makes a
# draft release; workflow_dispatch builds and checks the archives only.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Images by digest (docs/adr/0004). Fill in the digests of the multi-arch
  # indexes before the first run; the "images" step stops the jobs until then.
  ALPINE_IMAGE: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
  DEBIAN_IMAGE: debian:stable-slim@sha256:eb593cf2c358cacef45ca0a424bbc7d30cfa3466265fc2662b9466a0ca6ba1c5
  # the model that writes the release notes, fixed by name
  CLAUDE_MODEL: claude-opus-5-5
  # mise, which installs the pinned Claude Code of mise.toml, at an exact
  # version and the SHA-256 of its linux-x64 binary (docs/adr/0085)
  MISE_VERSION: "2026.10.18"
  MISE_SHA256: "e97c38973336aa2ff350fea50f47b412b266fe263b102b7200ff1e9b118c6942"

jobs:
  # A called workflow gets at most the permissions of the job that calls
  # it; the visual job of ci.yml asks for actions: read (docs/adr/0096),
  # and without it here every run of this workflow fails at startup
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      tag: ${{ steps.check.outputs.tag }}
      patch-base: ${{ steps.patch.outputs.patch-base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        name: VERSION, the tag, and the tag on main
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            sh scripts/release/check-version.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "::error::the tag $GITHUB_REF_NAME is not on main"
              exit 1
            }
          else
            sh scripts/release/check-version.sh >> "$GITHUB_OUTPUT"
            echo "tag=dev-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      # a patch release from v1.0.0 on keeps the output but the version in
      # the PDF (docs/adr/0174, docs/compatibility.md): check-patch.sh
      # decides whether the tag is a patch and writes its base, the patch
      # job compares (docs/adr/0212)
      - id: patch
        name: A patch release and its base (docs/adr/0212)
        if: github.ref_type == 'tag'
        run: |
          out=$(sh scripts/release/check-patch.sh "$GITHUB_REF_NAME")
          printf '%s\n' "$out"
          case $out in
            v*) echo "patch-base=$out" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            runner: ubuntu-24.04
          - platform: aarch64-linux
            runner: ubuntu-24.04-arm
          - platform: aarch64-macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: images
        run: |
          case "$ALPINE_IMAGE $DEBIAN_IMAGE" in
            *TODO*) echo "::error::fill in the image digests in release.yml"; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: wasmtime C API built for musl (scripts/fetch-wasmtime.sh)
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: third_party/wasmtime
          key: wasmtime-${{ matrix.platform }}-musl-${{ hashFiles('scripts/fetch-wasmtime.sh') }}
      - name: Build in Alpine (musl, static)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e COMMIT="$GITHUB_SHA" -e ALPINE_IMAGE -e ImageOS -e ImageVersion \
            "$ALPINE_IMAGE" sh scripts/release/build-linux.sh "$TAG" "$PLATFORM"
          sudo chown -R "$(id -u):$(id -g)" .
      # cabal reads and writes everything under ~/.cabal, whatever the
      # image and haskell-actions/setup leave in ~/.config/cabal
      # (docs/adr/0201)
      - name: cabal's directory (docs/adr/0201)
        if: runner.os == 'macOS'
        run: echo "CABAL_DIR=$HOME/.cabal" >> "$GITHUB_ENV"
      - id: setup
        if: runner.os == 'macOS'
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.3"
          cabal-version: "3.16.1.0"
      - name: cabal uses ~/.cabal (docs/adr/0201)
        if: runner.os == 'macOS'
        run: |
          test "$(cabal path -z --config-file)" = "$HOME/.cabal/config"
          test "$(cabal path -z --remote-repo-cache)" = "$HOME/.cabal/packages"
          test "$(cabal path -z --store-dir)" = "$HOME/.cabal/store"
      - name: Build (macOS 14 or later)
        if: runner.os == 'macOS'
        env:
          COMMIT: ${{ github.sha }}
        run: sh scripts/release/build-macos.sh "$TAG" "$PLATFORM"
      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.platform }}
          path: |
            dist/golem-*.tar.gz
            dist/golem-*.tar.gz.sha256
            dist/gmp-version-*.txt
      # what THIRD_PARTY_LICENSES/ was made from, not in the archive
      # (docs/adr/0007-third-party-licenses.md)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linkmap-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            dist/golem.map
            dist/wasmtime-nm.txt
            dist/wasmtime-strings.txt
            dist/wasmtime-ar.txt

  smoke:
    needs: [version, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            runner: ubuntu-24.04
          - platform: aarch64-linux
            runner: ubuntu-24.04-arm
          - platform: aarch64-macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      ARCHIVE: dist/golem-${{ needs.version.outputs.tag }}-${{ matrix.platform }}.tar.gz
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: archive-${{ matrix.platform }}
          path: dist
      # the golem of the archive holds the line "version: X.Y.Z" of the
      # libwasmtime.a it is linked with (docs/adr/0156)
      - name: The golem of the archive is linked with the wasmtime of fetch-wasmtime.sh (docs/adr/0156)
        run: |
          mkdir -p "$RUNNER_TEMP/linked"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/linked"
          sh scripts/check-wasmtime-linked.sh "$RUNNER_TEMP/linked/$(basename "$ARCHIVE" .tar.gz)/golem"
      - name: On the runner
        run: sh scripts/release/smoke.sh --deps --determinism "determinism-${{ matrix.platform }}.txt" "$ARCHIVE" "$VERSION"
      - name: In alpine
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD:/src:ro" -w /src "$ALPINE_IMAGE" sh scripts/release/smoke.sh "$ARCHIVE" "$VERSION"
      - name: In debian:stable-slim with ca-certificates
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$DEBIAN_IMAGE" sh -c \
            'apt-get update && apt-get install -y --no-install-recommends ca-certificates && sh scripts/release/smoke.sh "$1" "$2"' \
            sh "$ARCHIVE" "$VERSION"
      - name: In debian:stable-slim without ca-certificates
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/src:ro" -v /etc/ssl/certs/ca-certificates.crt:/certs/ca.pem:ro -w /src "$DEBIAN_IMAGE" \
            sh scripts/release/smoke.sh --no-certs /certs/ca.pem "$ARCHIVE" "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: determinism-${{ matrix.platform }}
          path: determinism-${{ matrix.platform }}.txt

  # golem.wasm (docs/adr/0199): built as the job wasm of ci.yml builds it,
  # checked under the node:wasi of Node LTS, its PDFs and diagnostics
  # compared with those of the golem of the x86-64 Linux archive, and packed
  # as golem-<tag>-wasm32-wasi.tar.gz with its licenses (package-wasm.sh)
  wasm:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GHC_VERSION: "9.10.3"
      HOSTTOOLS: ${{ github.workspace }}/third_party/hosttools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Image for the cache keys
        run: |
          test -n "$ImageOS"
          echo "ImageOS=$ImageOS" >> "$GITHUB_ENV"
      - id: hosttools
        name: Cache the native alex and happy (docs/adr/0202)
        uses: actions/cache@v6
        with:
          path: third_party/hosttools
          key: hosttools-alex-3.5.4.2-happy-2.2-ghc-${{ env.GHC_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}
      - if: steps.hosttools.outputs.cache-hit != 'true'
        name: cabal's directory (docs/adr/0201)
        run: echo "CABAL_DIR=$HOME/.cabal" >> "$GITHUB_ENV"
      - if: steps.hosttools.outputs.cache-hit != 'true'
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: "3.16.1.0"
          cabal-update: true
      - if: steps.hosttools.outputs.cache-hit != 'true'
        name: The native alex and happy (docs/adr/0202)
        run: |
          mkdir -p "$HOSTTOOLS" "$RUNNER_TEMP/hosttools-src"
          cd "$RUNNER_TEMP/hosttools-src"
          cabal install alex-3.5.4.2 happy-2.2 --installdir="$HOSTTOOLS" --install-method=copy --overwrite-policy=always
      - name: The native alex and happy are those versions
        run: |
          "$HOSTTOOLS/alex" --version | grep -F 'Alex version 3.5.4.2'
          "$HOSTTOOLS/happy" --version | grep -F 'Happy Version 2.2'
      - id: ghcwasm
        name: Cache the wasm toolchain and its cabal store (docs/adr/0199)
        uses: actions/cache@v6
        with:
          path: third_party/ghc-wasm
          key: ghc-wasm-${{ hashFiles('scripts/fetch-ghc-wasm.sh') }}-${{ hashFiles('cabal.project.wasm', 'cabal.project.wasm.freeze', 'scripts/fetch-wasm-packages.sh', 'scripts/wasm/patches/*') }}
          restore-keys: ghc-wasm-${{ hashFiles('scripts/fetch-ghc-wasm.sh') }}-
      - name: The wasm toolchain (docs/adr/0199)
        run: timeout -k 10 900 sh scripts/fetch-ghc-wasm.sh
      - name: skylighting 0.15 patched (docs/adr/0202)
        run: timeout -k 10 300 sh scripts/fetch-wasm-packages.sh
      - name: The versions of Hackage are those of cabal.project.freeze (docs/adr/0199)
        run: sh scripts/ci/wasm-freeze.sh
      - if: steps.ghcwasm.outputs.cache-hit != 'true'
        name: The Hackage index of the wasm build
        run: |
          . third_party/ghc-wasm/env
          wasm32-wasi-cabal update
      # from nothing: no dist-wasm of an earlier build
      - name: golem.wasm (docs/adr/0199)
        shell: bash
        run: |
          . third_party/ghc-wasm/env
          export PATH="$HOSTTOOLS:$PATH"
          wasm32-wasi-cabal --project-file=cabal.project.wasm --builddir=dist-wasm build -v1 exe:golem-wasm
          cp "$(wasm32-wasi-cabal --project-file=cabal.project.wasm --builddir=dist-wasm list-bin -v0 exe:golem-wasm)" golem.wasm
          ls -l golem.wasm
      # cabal 3.14 plans and builds the build-tool-depends alex and happy
      # of the packages with the wasm GHC too: their executables in
      # the store are wasm modules (alex.wasm, happy.wasm), which cabal does
      # not take for alex and happy and which cannot run here, so the lexer
      # and the parser of toml-parser come from the native alex and happy on
      # the PATH, of the versions of cabal.project.freeze
      - name: The build tools in the wasm store are wasm, not run (docs/adr/0202)
        run: |
          find third_party/ghc-wasm/.cabal/store -path '*/bin/*' -type f
          found=0
          for f in $(find third_party/ghc-wasm/.cabal/store -path '*/bin/*' \( -name 'alex*' -o -name 'happy*' \)); do
            found=$((found + 1))
            test "$(od -An -tx1 -N4 "$f" | tr -d ' ')" = 0061736d
            echo "$f: a wasm module"
          done
          test "$found" = 2
      - name: The checks of golem.wasm under node:wasi (docs/adr/0199)
        run: node scripts/wasm/run.mjs check golem.wasm modules/golem-driver/test/fixtures/kanikosen
      - uses: actions/download-artifact@v8
        with:
          name: archive-x86_64-linux
          path: dist-native
      - name: The PDFs and the diagnostics of golem.wasm are those of the golem of the x86-64 Linux archive (docs/adr/0199)
        run: |
          mkdir -p "$RUNNER_TEMP/native"
          tar -xzf "dist-native/golem-$TAG-x86_64-linux.tar.gz" -C "$RUNNER_TEMP/native"
          sh scripts/wasm/compare.sh --native "$RUNNER_TEMP/native/golem-$TAG-x86_64-linux/golem" > wasm-native-list.txt
          sh scripts/wasm/compare.sh golem.wasm > wasm-list.txt
          sh scripts/wasm/compare.sh --check wasm-native-list.txt wasm-list.txt
      # the GMP of the wasm GHC, its source, and the documents of the wasm
      # GHC for THIRD_PARTY_LICENSES/ (docs/adr/0007, docs/adr/0199)
      - name: golem-<tag>-wasm32-wasi.tar.gz (docs/adr/0199)
        run: |
          . third_party/ghc-wasm/env
          GMP_VERSION=$(GMP_GHC=wasm32-wasi-ghc sh scripts/release/gmp-version.sh)
          sh scripts/release/fetch-gmp.sh "$GMP_VERSION" "$RUNNER_TEMP/gmp"
          WASM_GHC_VERSION=$(wasm32-wasi-ghc --numeric-version)
          GHC_DOCDIR=third_party/ghc-wasm/wasm32-wasi-ghc/lib/doc/wasm32-wasi-ghc-$WASM_GHC_VERSION-inplace
          test -f "$GHC_DOCDIR/ghc-$WASM_GHC_VERSION/LICENSE"
          GHC_VERSION=$WASM_GHC_VERSION GHC_DOCDIR="$PWD/$GHC_DOCDIR" GMP_VERSION=$GMP_VERSION \
            GMP_SOURCE="$RUNNER_TEMP/gmp/gmp-$GMP_VERSION.tar.xz" CABAL_PACKAGES="$PWD/third_party/ghc-wasm/.cabal/packages/hackage.haskell.org" \
            sh scripts/release/package-wasm.sh "$TAG" golem.wasm dist-wasm/cache/plan.json dist
      - uses: actions/upload-artifact@v7
        with:
          name: archive-wasm32-wasi
          path: |
            dist/golem-*.tar.gz
            dist/golem-*.tar.gz.sha256
            dist/gmp-version-*.txt

  # the golem of a patch builds the inputs of its base release, with the
  # scripts of the base, to the references of the base; a manual or a
  # fixture fixed before the patch changes nothing (docs/adr/0212)
  patch:
    needs: [version, build]
    if: needs.version.outputs.patch-base != ''
    runs-on: ubuntu-24.04
    env:
      BASE: ${{ needs.version.outputs.patch-base }}
      ARCHIVE: dist/golem-${{ needs.version.outputs.tag }}-x86_64-linux.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: archive-x86_64-linux
          path: dist
      - name: The golem of the tag builds the inputs of the base release as the base did (docs/adr/0212)
        run: |
          mkdir -p "$RUNNER_TEMP/golem"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/golem"
          sh scripts/release/check-patch-output.sh "$BASE" "$RUNNER_TEMP/golem/$(basename "$ARCHIVE" .tar.gz)/golem"

  determinism:
    needs: [ci, smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: determinism-*
          merge-multiple: true
      - name: The archives and CI give byte-identical outputs
        run: |
          for p in x86_64-linux aarch64-linux aarch64-macos; do
            diff determinism-ubuntu-24.04.txt "determinism-$p.txt"
          done

  # Claude Code writes the release notes in a job of its own, with no write
  # permission and no OIDC token (docs/adr/0044). The version of Claude
  # Code is the one of mise.toml. workflow_dispatch writes the notes of the
  # commit, to try the job; the release job does not run then.
  notes:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      REF: ${{ github.ref_type == 'tag' && needs.version.outputs.tag || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v5
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        with:
          cache: false
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}
      - name: Release notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/release/write-notes.sh "$REF" notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  # patch is skipped when the tag is not a patch; the release waits for it
  # and runs only when it passed or was not needed (docs/adr/0212)
  release:
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' &&
      needs.version.result == 'success' && needs.ci.result == 'success' &&
      needs.build.result == 'success' && needs.smoke.result == 'success' &&
      needs.wasm.result == 'success' && needs.determinism.result == 'success' &&
      needs.notes.result == 'success' &&
      (needs.patch.result == 'success' ||
      (needs.patch.result == 'skipped' && needs.version.outputs.patch-base == ''))
    needs: [version, ci, build, smoke, wasm, determinism, notes, patch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      # the manuals, built with the golem of the x86-64 Linux archive; the
      # colophon shows the tag (docs/adr/0022, docs/adr/0024)
      - name: The PDF and the HTML of the manuals
        run: |
          tar -xzf "dist/golem-$TAG-x86_64-linux.tar.gz" -C "$RUNNER_TEMP"
          GOLEM="$RUNNER_TEMP/golem-$TAG-x86_64-linux/golem" GOLEM_MANUAL_TAG="$TAG" sh scripts/manual/build.sh
          for pair in manual:golem-manual manual-dev:golem-dev-manual; do
            dir=${pair%%:*} name=${pair#*:}
            set -- "$dir"/build/pdf/*.pdf
            [ $# -eq 1 ] && [ -f "$1" ]
            cp "$1" "dist/$name-$TAG.pdf"
            tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
              --transform "s,^html,$name-$TAG-html," -C "$dir/build" -cf - html |
              gzip -n > "dist/$name-$TAG-html.tar.gz"
          done
      # the sample plugins, as committed: the plugins job of ci.yml checked
      # that they are what their sources build (docs/adr/0106); an archive of
      # their license documents: licenses/plugins/, which the same job checked,
      # and the LICENSE of Golem (docs/adr/0133)
      - name: SHA256SUMS, the sample plugins and the source of GMP
        run: |
          cp plugins/wasm/*.wasm dist/
          lic=golem-plugins-licenses-$TAG
          mkdir -p "$RUNNER_TEMP/$lic"
          cp LICENSE "$RUNNER_TEMP/$lic/LICENSE"
          cp -R licenses/plugins "$RUNNER_TEMP/$lic/THIRD_PARTY_LICENSES"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -C "$RUNNER_TEMP" -cf - "$lic" | gzip -n > "dist/$lic.tar.gz"
          cd dist
          cat golem-*.tar.gz.sha256 > SHA256SUMS
          sha256sum "golem-manual-$TAG.pdf" "golem-manual-$TAG-html.tar.gz" \
            "golem-dev-manual-$TAG.pdf" "golem-dev-manual-$TAG-html.tar.gz" >> SHA256SUMS
          sha256sum *.wasm >> SHA256SUMS
          sha256sum "golem-plugins-licenses-$TAG.tar.gz" >> SHA256SUMS
          sha256sum -c SHA256SUMS
          for v in $(cat gmp-version-*.txt | sort -u); do
            sh ../scripts/release/fetch-gmp.sh "$v" .
          done
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/golem-*.tar.gz
      - uses: actions/download-artifact@v8
        with:
          name: notes
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -- --draft --verify-tag --title "$TAG" --notes-file notes.md
          if [ "$PRERELEASE" = true ]; then set -- "$@" --prerelease; fi
          # dist/golem-*.tar.gz has the archive of golem.wasm, the HTML of the two
          # manuals and the license documents of the plugins too
          gh release create "$TAG" "$@" dist/golem-*.tar.gz dist/golem-manual-*.pdf dist/golem-dev-manual-*.pdf dist/*.wasm dist/SHA256SUMS dist/gmp-*.tar.xz
