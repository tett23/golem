name: Browser probe (temporary, ADR 0234)

on:
  push:
    branches: [impl-0234]

permissions:
  contents: read

jobs:
  chromium-file-fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: chrome-headless-shell and fetch from file://
        run: |
          set -eux
          V=157.0.8103.38
          curl -fsSLo z.zip "https://storage.googleapis.com/chrome-for-testing-public/$V/linux64/chrome-headless-shell-linux64.zip"
          sha256sum z.zip
          unzip -q z.zip
          B=$PWD/chrome-headless-shell-linux64/chrome-headless-shell
          "$B" --version || true
          mkdir -p p
          printf 'hello' > p/data.txt
          cat > p/index.html <<'EOF'
          <!doctype html><html><body><div id="r">pending</div><script>
          fetch('data.txt').then(r => r.text()).then(t => { document.getElementById('r').textContent = 'ok:' + t; })
            .catch(e => { document.getElementById('r').textContent = 'err:' + e; });
          </script></body></html>
          EOF
          echo "--- with the sandbox"
          timeout 60 "$B" --headless --disable-gpu --virtual-time-budget=5000 --dump-dom "file://$PWD/p/index.html" 2>err1.txt | tee out1.txt || true
          tail -5 err1.txt
          echo "--- without the sandbox"
          timeout 60 "$B" --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "file://$PWD/p/index.html" 2>err2.txt | tee out2.txt || true
          tail -5 err2.txt
          echo "--- over http://127.0.0.1"
          (cd p && node -e 'const h=require("http"),f=require("fs");h.createServer((q,s)=>{try{s.end(f.readFileSync("."+q.url))}catch{s.statusCode=404;s.end()}}).listen(8123)') &
          sleep 1
          timeout 60 "$B" --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "http://127.0.0.1:8123/index.html" 2>err3.txt | tee out3.txt || true
          echo "--- remote debugging line"
          timeout 10 "$B" --remote-debugging-port=0 --user-data-dir="$RUNNER_TEMP/ud" about:blank 2>&1 | head -5 || true
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true

  safari:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Versions
        run: |
          sw_vers
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/Safari.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' /Applications/Safari.app/Contents/Info.plist
          uname -m
          node --version
      - name: safaridriver opens a Safari window
        run: |
          set -eux
          sudo safaridriver --enable
          safaridriver --port 4444 &
          sleep 2
          mkdir -p p
          printf 'hello' > p/data.txt
          cat > p/index.html <<'EOF'
          <!doctype html><html><body><div id="r">pending</div><script>
          fetch('data.txt').then(r => r.text()).then(t => { document.getElementById('r').textContent = 'ok:' + t; })
            .catch(e => { document.getElementById('r').textContent = 'err:' + e; });
          </script></body></html>
          EOF
          (cd p && node -e 'const h=require("http"),f=require("fs");h.createServer((q,s)=>{try{s.end(f.readFileSync("."+q.url))}catch{s.statusCode=404;s.end()}}).listen(8123)') &
          sleep 1
          S=$(curl -sS -X POST -H 'Content-Type: application/json' -d '{"capabilities":{"alwaysMatch":{"browserName":"safari"}}}' http://127.0.0.1:4444/session)
          echo "$S"
          ID=$(printf '%s' "$S" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).value.sessionId))')
          curl -sS -X POST -H 'Content-Type: application/json' -d '{"url":"http://127.0.0.1:8123/index.html"}' "http://127.0.0.1:4444/session/$ID/url"
          sleep 2
          curl -sS -X POST -H 'Content-Type: application/json' -d '{"script":"return [document.getElementById(\"r\").textContent, devicePixelRatio, innerWidth, innerHeight, window.isSecureContext, typeof crypto.subtle]","args":[]}' "http://127.0.0.1:4444/session/$ID/execute/sync"
          echo
          curl -sS -X POST -H 'Content-Type: application/json' -d '{"x":0,"y":0,"width":800,"height":600}' "http://127.0.0.1:4444/session/$ID/window/rect"
          echo
          curl -sS "http://127.0.0.1:4444/session/$ID/screenshot" | head -c 200
          echo
          curl -sS -X POST -H 'Content-Type: application/json' -d '{"url":"file://'"$PWD"'/p/index.html"}' "http://127.0.0.1:4444/session/$ID/url"
          sleep 2
          curl -sS -X POST -H 'Content-Type: application/json' -d '{"script":"return document.getElementById(\"r\").textContent","args":[]}' "http://127.0.0.1:4444/session/$ID/execute/sync"
          echo
          curl -sS -X DELETE "http://127.0.0.1:4444/session/$ID"
