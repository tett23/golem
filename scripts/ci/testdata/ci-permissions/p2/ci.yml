name: CI
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - run: true
  visual:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - run: true
  caches:
    needs: [build]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - run: true
