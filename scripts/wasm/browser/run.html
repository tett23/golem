<!DOCTYPE html>
<!--
  The browser page for golem.wasm (docs/adr/0234 section 5, docs/adr/0309).
  scripts/wasm/run-browser.mjs serves it at /__golem/run.html with worker.js,
  golem.wasm, the browser_wasi_shim files under /__golem/shim/, and the
  project files. The module Worker builds the PDF and returns its status,
  SHA-256, length and diagnostics to golemBuild().
-->
<html><head><meta charset="utf-8"/><title>golem.wasm</title></head>
<body><script>
window.golemBuild = () => new Promise((resolve, reject) => {
  const worker = new Worker('worker.js', { type: 'module' });
  worker.addEventListener('message', ({ data }) => {
    worker.terminate();
    if (data.ok) resolve(data.v);
    else reject(new Error(data.e));
  }, { once: true });
  worker.addEventListener('error', (event) => {
    worker.terminate();
    reject(new Error(`worker: ${event.message}`));
  }, { once: true });
});
</script></body></html>
