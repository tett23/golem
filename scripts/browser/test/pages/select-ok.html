<!DOCTYPE html>
<!-- I1: line numbers and diff marks with user-select: none, a block of one line, and an empty block -->
<html><head><meta charset="utf-8"/><style>
pre .line { display: inline-block; width: 100%; }
.ln, .dm { user-select: none; -webkit-user-select: none; }
</style></head><body>
<pre><code><span class="line"><span class="ln" aria-hidden="true">1</span><span class="dm" aria-hidden="true">+</span>main = pure ()</span>
<span class="line"><span class="ln" aria-hidden="true">2</span><span class="dm" aria-hidden="true"> </span>  -- done</span></code></pre>
<pre><code><span class="line"><span class="ln" aria-hidden="true">1</span>only one line</span></code></pre>
<pre><code></code></pre>
</body></html>
