<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1010" viewBox="0 0 1300 1010">
  <!-- パッケージの依存（modules/*/*.cabal の build-depends から、ほかの依存を通して届く矢印と golem-syntax への矢印を除いたもの）。
       scripts/manual/render-figures.sh で manual-dev/images/modules.png にする。 -->
  <style>
    @font-face { font-family: "Fig Sans"; src: url("../../fonts/NotoSansJP-Regular.otf"); }
    @font-face { font-family: "Fig Sans"; font-weight: bold; src: url("../../fonts/NotoSansJP-Bold.otf"); }
    text { font-family: "Fig Sans", sans-serif; font-size: 26px; fill: #222; }
    .name { text-anchor: middle; dominant-baseline: central; }
    .note { font-size: 22px; }
    rect.box { stroke: #333; stroke-width: 2; rx: 6; }
    .core { fill: #f2f2f2; }
    .pdf { fill: #dce8f5; }
    .web { fill: #e0f0da; }
    .txt { fill: #f6ecd2; }
    .tool { fill: #ffffff; }
    line, path.edge { stroke: #444; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1300" height="1010" fill="#fff"/>

  <!-- edges -->
  <line x1="650" y1="78" x2="650" y2="122"/>
  <line x1="650" y1="178" x2="650" y2="222"/>
  <line x1="690" y1="178" x2="985" y2="222"/>
  <line x1="610" y1="278" x2="110" y2="342"/>
  <line x1="620" y1="278" x2="300" y2="342"/>
  <line x1="635" y1="278" x2="465" y2="342"/>
  <line x1="650" y1="278" x2="630" y2="342"/>
  <line x1="665" y1="278" x2="800" y2="342"/>
  <line x1="680" y1="278" x2="975" y2="342"/>
  <line x1="690" y1="278" x2="1160" y2="342"/>
  <line x1="290" y1="398" x2="290" y2="462"/>
  <line x1="95" y1="398" x2="335" y2="702"/>
  <line x1="300" y1="518" x2="350" y2="702"/>
  <line x1="470" y1="398" x2="515" y2="462"/>
  <line x1="620" y1="398" x2="550" y2="462"/>
  <line x1="820" y1="398" x2="880" y2="462"/>
  <line x1="980" y1="398" x2="920" y2="462"/>
  <line x1="545" y1="518" x2="680" y2="582"/>
  <line x1="880" y1="518" x2="720" y2="582"/>
  <line x1="680" y1="638" x2="390" y2="702"/>
  <line x1="725" y1="638" x2="980" y2="702"/>
  <line x1="360" y1="758" x2="360" y2="822"/>
  <line x1="360" y1="878" x2="360" y2="942"/>
  <path class="edge" d="M1085,250 H1280 V850 H435"/>

  <!-- nodes: center x, y; width 150 (layout-spec 190) -->
  <rect class="box tool" x="575" y="22" width="150" height="56"/><text class="name" x="650" y="50">cli</text>
  <rect class="box tool" x="575" y="122" width="150" height="56"/><text class="name" x="650" y="150">lsp</text>
  <rect class="box tool" x="575" y="222" width="150" height="56"/><text class="name" x="650" y="250">driver</text>
