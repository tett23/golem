  <rect class="box web" x="215" y="462" width="150" height="56"/><text class="name" x="290" y="490">html</text>
  <rect class="box core" x="455" y="462" width="150" height="56"/><text class="name" x="530" y="490">eval</text>
  <rect class="box pdf" x="805" y="462" width="190" height="56"/><text class="name" x="900" y="490">layout-spec</text>

  <rect class="box core" x="625" y="582" width="150" height="56"/><text class="name" x="700" y="610">project</text>

  <rect class="box core" x="285" y="702" width="150" height="56"/><text class="name" x="360" y="730">doc</text>
  <rect class="box core" x="925" y="702" width="150" height="56"/><text class="name" x="1000" y="730">regex</text>

  <rect class="box core" x="285" y="822" width="150" height="56"/><text class="name" x="360" y="850">parser</text>
  <rect class="box core" x="285" y="942" width="150" height="56"/><text class="name" x="360" y="970">syntax</text>
  <text class="note" x="455" y="962">regex と font を除くすべてが使う</text>
  <text class="note" x="455" y="990">（この矢印は省いた）</text>

  <!-- legend -->
  <rect class="box pdf" x="900" y="900" width="36" height="24"/><text class="note" x="946" y="920">PDF 経路</text>
  <rect class="box web" x="1110" y="900" width="36" height="24"/><text class="note" x="1156" y="920">Web 経路</text>
  <rect class="box txt" x="900" y="944" width="36" height="24"/><text class="note" x="946" y="964">テキスト経路</text>
  <rect class="box core" x="1110" y="944" width="36" height="24"/><text class="note" x="1156" y="964">共通</text>
</svg>
