  <rect class="box txt" x="20" y="342" width="150" height="56"/><text class="name" x="95" y="370">text</text>
  <rect class="box web" x="215" y="342" width="150" height="56"/><text class="name" x="290" y="370">epub</text>
  <rect class="box core" x="385" y="342" width="150" height="56"/><text class="name" x="460" y="370">lint</text>
  <rect class="box core" x="555" y="342" width="150" height="56"/><text class="name" x="630" y="370">plugin</text>
  <rect class="box pdf" x="735" y="342" width="150" height="56"/><text class="name" x="810" y="370">layout</text>
