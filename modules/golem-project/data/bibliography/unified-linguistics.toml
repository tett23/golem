# De Gruyter Mouton Journal Style Sheet v1.3, primary source.
# https://www.degruyterbrill.com/publication/journal_key/JPLR/downloadAsset/JPLR_Mouton_journal_stylesheet.pdf
# Primary examples: docs/research/bibliography-styles.md.
# Complete root ADR 0470 acceptance checks remain pending.
[bibliography]
style = 'unified-linguistics'
[bibliography.styles.unified-linguistics]
citation-mode = 'author-year'
citation = ['{author} {year}', ': {locator}']
citation-prefix = '('
citation-suffix = ')'
sort = ['author', 'year', 'title']
page-range = 'full'
range-delimiter = '–'
citation-delimiter = '; '
citation-sort = 'written'
hanging-indent = '0pt'
year-suffix = true
citation-year = ['{year}', ': {locator}']
[bibliography.styles.unified-linguistics.names.author]
order = 'first-family-given'
part-delimiter = ', '
initials = false
initial-format = '{i}'
initial-delimiter = ' '
delimiter = ', '
last-delimiter = ' & '
[bibliography.styles.unified-linguistics.names.editor]
order = 'given-family'
part-delimiter = ' '
initials = false
initial-format = '{i}'
initial-delimiter = ' '
delimiter = ', '
last-delimiter = ' & '
label = ['ed.', 'eds.']
[bibliography.styles.unified-linguistics.types.chapter]
pieces = ['{author}', '. {year}', '. {title}', '. In {editor}', ' ({editor-label}), ', '{container-title}', ' ({collection-title} {collection-number})', ', {page}', '. {publisher-place}', ': {publisher}', '.', ' https://doi.org/{DOI}']
char-styles = { container-title = 'italic' }

[bibliography.styles.unified-linguistics.names.short]
delimiter = ', '
last-delimiter = ' and '
max = 2
use-first = 1
et-al = ' et al.'

[bibliography.styles.unified-linguistics.locator-labels]
page = ['', '']
chapter = ['Ch.', 'Ch.']

[bibliography.styles.unified-linguistics.types.book]
pieces = ['{author}', '. {year}', '. {title}', '. {publisher-place}', ': {publisher}', '.', ' https://doi.org/{DOI}']
char-styles = { title = 'italic' }

[bibliography.styles.unified-linguistics.types.article-journal]
pieces = ['{author}', '. {year}', '. {title}', '. {container-title}', ' {volume}', '({issue})', '. {page}', '.', ' https://doi.org/{DOI}']
char-styles = { container-title = 'italic' }

[bibliography.styles.unified-linguistics.types.default]
pieces = ['{author}', '. {year}', '. {title}', '.']
