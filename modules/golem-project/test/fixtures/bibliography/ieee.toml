# IEEE Reference Guide V 3.28.2025, primary example transcribed in docs/research/bibliography-styles.md.
# https://journals.ieeeauthorcenter.ieee.org/wp-content/uploads/sites/7/IEEE_Reference_Guide.pdf
# This fixture covers only this transcribed article, not a complete bundled style.
# The explicit name bound is the example author count, not a publication-wide rule.
[bibliography]
style = 'example'
[bibliography.styles.example]
citation-mode = 'numeric'
citation = ['[{number}]']
sort = ['citation']
page-range = 'full'
range-delimiter = '–'
months = ['Jan. ', 'Feb. ', 'Mar. ', 'Apr. ', 'May ', 'Jun. ', 'Jul. ', 'Aug. ', 'Sep. ', 'Oct. ', 'Nov. ', 'Dec. ']
[bibliography.styles.example.names.author]
order = 'given-family'
part-delimiter = ' '
initials = true
initial-format = '{i}.'
initial-delimiter = ' '
delimiter = ', '
last-delimiter = ' and '
max = 2
use-first = 2
et-al = ''
[bibliography.styles.example.types.article-journal]
pieces = ['{author}', ', "{title}," ', '{container-title}', ', vol. {volume}', ', no. {issue}', ', pp. {page}', ', {month?}{year}', ', doi: {DOI}.']
char-styles = { container-title = 'italic' }
