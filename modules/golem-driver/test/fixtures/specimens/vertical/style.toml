# 目で見る項目の見本の縦組みの二段の本（docs/adr/0233）
[page]
size = "A5"
binding = "right"
writing-mode = "vertical"

[page.grid]
font-size = "13Q"
characters = 20
lines = 22
line-pitch = "22H"
columns = 2
column-gap = "2zw"
position = { top = "20mm", gutter = "18mm" }

[fonts.body]
ja = "fonts/ja.otf"
latin = "fonts/latin.otf"

[headings.1]
page-break = "any"
size = "1.5zw"
rule-after = { weight = "0.5pt", space-before = "0.5zw" }

[headings.2]
rule-after = { weight = "0.3pt", space-before = "0.25zw", length = "4zw" }

[paragraph-styles.body]
first-line-indent = "1zw"

[paragraph-styles.adr]
first-line-indent = "0zw"

[paragraph-styles.section]
first-line-indent = "1zw"
rule-before = { weight = "0.5pt", space-before = "0.5zw", space-after = "0.5zw" }

[paragraph-styles.palt]
first-line-indent = "0zw"
proportional-metrics = true

[paragraph-styles.full]
first-line-indent = "0zw"

[color.swatches]
red = { cmyk = [0, 100, 100, 0] }
blue = { cmyk = [100, 60, 0, 0] }
pale = { cmyk = [8, 0, 0, 0] }

# 段落の背景と囲み罫（docs/adr/0271）。題と本文の段落スタイルは違うが、囲みの設定が等しいので一つの囲みになる。
[paragraph-styles.column-title]
first-line-indent = "0zw"
background = "pale"
padding = "0.5zw"
border = "blue"
border-width = "1pt"
border-radius = "1zw"

[paragraph-styles.column]
first-line-indent = "1zw"
background = "pale"
padding = "0.5zw"
border = "blue"
border-width = "1pt"
border-radius = "1zw"

# 行の始まりの辺だけの注意書き
[paragraph-styles.caution]
first-line-indent = "0zw"
indent = "1zw"
padding = "0.5zw"
border = "red"
border-width = "2pt"
border-sides = ["start"]

[composition]
hanging-punctuation = true

[numbers]
vertical = "kanji"

[notes.rule]
length = "8zw"
space-before = "0.5zw"
space-after = "0.5zw"

[masters.body]
running-head = { position = "top-outside", content = "heading.1.short" }
folio = { position = "bottom-outside", format = "{n}" }

# 隠しノンブル（golem-driver ADR 0021）。トンボを付けた版（見た目の回帰のテストの
# specimens-vertical-marks-japanese）にだけ入る。どのページにもノンブルがあるので、
# すべてのページに入れる
[hidden-folio]
pages = "all"
