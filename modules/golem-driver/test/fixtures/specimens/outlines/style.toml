# 輪郭に沿う回り込みの見本の横組みの本（root ADR 0464 A1）
[page]
size = "A5"
binding = "left"
writing-mode = "horizontal"

[page.grid]
font-size = "12Q"
characters = 32
lines = 30
line-pitch = "19H"
position = { top = "24mm", gutter = "17mm" }

[fonts.body]
ja = "fonts/ja.otf"
latin = "fonts/latin.otf"

[headings.1]
page-break = "any"
size = "1.5zw"

[figures]
number = "図{n}"
wrap-gap = "1zw"

