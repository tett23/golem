[page]
size = "B6"
binding = "right"
writing-mode = "vertical"

[page.grid]
font-size = "13Q"
characters = 42
lines = 16
line-pitch = "22H"
columns = 1
position = { top = "18mm", gutter = "20mm" }

[masters.body]
folio = { position = "bottom-outside", format = "{n}" }

[fonts.body]
# Noto Serif CJK JP 2.003 (Subset OTF), SIL Open Font License 1.1
ja = "fonts/NotoSerifJP-Regular.otf"

[paragraph-styles.indent-0-1]
indent = "1zw"
first-line-indent = "-1zw"

[paragraph-styles.indent-5-5]
indent = "5zw"
first-line-indent = "0zw"
