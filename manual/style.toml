# Golem マニュアルの体裁

[page]
size = "A5"
binding = "left"
writing-mode = "horizontal"

# 本文 13Q、行送り 22H、一行 32 字、29 行。
# 字数は 35 字から 32 字に減らした。
# 小口側の余白に傍注欄（幅 6zw と間隔 1zw）を取り、
# 仕上がりの端までの余裕も残すため。
[page.grid]
font-size = "13Q"
characters = 32
lines = 29
line-pitch = "22H"
position = { top = "22mm", gutter = "14mm" }

[fonts.body]
ja = "fonts/NotoSerifJP-Regular.otf"
latin = "fonts/SourceSerif4-Regular.otf"

[fonts.heading]
ja = "fonts/NotoSansJP-Bold.otf"
latin = "fonts/SourceSans3-Bold.otf"

[fonts.code]
ja = "fonts/NotoSansJP-Regular.otf"
latin = "fonts/SourceCodePro-Regular.otf"

[character-styles.bold]
font = "heading"

[character-styles.code]
color = "code"

[paragraph-styles.body]
first-line-indent = "1zw"

[paragraph-styles.memo]
font = "heading"
size = "11Q"
indent = "2zw"

[paragraph-styles.caption]
size = "11Q"

[paragraph-styles.sidenote]
size = "10Q"

[paragraph-styles.code]
size = "11Q"
background = "code-bg"

[headings.1]
font = "heading"
size = "20Q"
number = "第{n}章"
page-break = "recto"

[headings.2]
font = "heading"
size = "15Q"
number = "{1}.{n}"

[headings.3]
font = "heading"
number = "{1}.{2}.{n}"

[composition]
hanging-punctuation = true

# 脚注の前に区切り線を引く（golem-driver ADR 0024）。
[notes.rule]
length = "8zw"
space-before = "0.5zw"
space-after = "0.5zw"

[sidenotes]
width = "6zw"
gap = "1zw"

# 索引は 15 字の二段で組む（docs/adr/0025）。
[index]
columns = 2
column-gap = "2zw"

[color.swatches]
accent = { cmyk = [0, 80, 100, 0] }
code = { cmyk = [90, 50, 0, 20] }
code-bg = { cmyk = [0, 0, 0, 8] }

[masters.body]
folio = { position = "bottom-outside", format = "{n}" }

[masters.body.running-head]
position = "top-outside"
content = "heading.1.short"

# 注の印を本文の 0.65 倍の大きさで組む（golem-driver ADR 0025、docs/manual-policy.md）。
[notes]
mark-size = "0.65zw"
