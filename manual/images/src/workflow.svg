<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1330" viewBox="0 0 1000 1330">
  <!-- 本を作る仕事の流れの、これまでと Golem での流れ（manual/preface.gm の「はじめに」）。
       下半分は「なぜ Golem で解決できるのか」の四つの仕組み（決定性、バージョン管理、CI、見た目の回帰テスト）を、働く位置に置く。
       色と線は manual-dev/images/src/ の図にそろえる。
       scripts/manual/outline-figures.sh で、文字を輪郭にした manual/images/workflow.svg にする。 -->
  <style>
    @font-face { font-family: "Fig Sans"; src: url("../../fonts/NotoSansJP-Regular.otf"); }
    @font-face { font-family: "Fig Sans"; font-weight: bold; src: url("../../fonts/NotoSansJP-Bold.otf"); }
    text { font-family: "Fig Sans", sans-serif; font-size: 24px; fill: #222; }
    .c { text-anchor: middle; dominant-baseline: central; }
    .s { text-anchor: start; dominant-baseline: central; }
    .head { font-size: 27px; font-weight: bold; }
    .mech { font-size: 25px; font-weight: bold; }
    .mod { font-size: 21px; fill: #555; }
    .label { font-size: 21px; fill: #333; }
    rect.box { fill: #fff; stroke: #333; stroke-width: 2; rx: 8; }
    rect.band { stroke: #333; stroke-width: 2; rx: 10; }
    path.pg { fill: #fff; stroke: #555; stroke-width: 1.5; }
    path.pagex { fill: #fff; stroke: #333; stroke-width: 3; }
    path.fold { fill: none; stroke: #555; stroke-width: 1.5; }
    line.txt { stroke: #999; stroke-width: 2; marker-end: none; }
    line.txtx { stroke: #333; stroke-width: 2.5; marker-end: none; }
    .before { fill: #f4f4f4; }
    .vcs { fill: #e0f0da; }
    .ci { fill: #f2f2f2; }
    .det { fill: #dce8f5; }
    .vrt { fill: #f6ecd2; }
    line, path.edge { stroke: #444; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1000" height="1330" fill="#fff"/>

  <!-- ===== before: three copies, round trips between the people ===== -->
  <rect class="before" x="10" y="10" width="980" height="440" rx="10"/>
  <text class="s head" x="30" y="40">これまで</text>

  <rect class="box" x="40" y="80" width="280" height="110"/>
  <text class="c" x="180" y="118">著者</text>
  <text class="c mod" x="180" y="156">Word の原稿</text>

  <rect class="box" x="680" y="80" width="280" height="110"/>
  <text class="c" x="820" y="118">DTP オペレーター</text>
  <text class="c mod" x="820" y="156">InDesign のドキュメント</text>

  <rect class="box" x="360" y="310" width="280" height="110"/>
  <text class="c" x="500" y="348">編集者</text>
  <text class="c mod" x="500" y="386">赤字を書き込んだ PDF</text>

  <line x1="322" y1="118" x2="676" y2="118"/>
  <line x1="678" y1="156" x2="324" y2="156"/>
  <text class="c label" x="500" y="100">原稿</text>
  <text class="c label" x="500" y="176">ゲラ</text>
  <line x1="150" y1="192" x2="356" y2="340"/>
  <line x1="358" y1="390" x2="110" y2="194"/>
  <text class="c label" x="160" y="320">赤字（ファクス）</text>
  <line x1="644" y1="340" x2="850" y2="194"/>
  <line x1="890" y1="194" x2="642" y2="390"/>
  <text class="c label" x="850" y="320">赤字（PDF の注釈）</text>

  <!-- ===== with Golem: the four mechanisms where they act ===== -->
  <text class="s head" x="30" y="490">Golem では</text>

  <rect class="box" x="100" y="520" width="200" height="50"/>
  <text class="c" x="200" y="545">著者</text>
  <rect class="box" x="390" y="520" width="200" height="50"/>
  <text class="c" x="490" y="545">編集者</text>
  <rect class="box" x="650" y="520" width="260" height="50"/>
  <text class="c" x="780" y="545">DTP オペレーター</text>
  <line x1="200" y1="572" x2="200" y2="614"/>
  <line x1="490" y1="572" x2="490" y2="614"/>
  <line x1="780" y1="572" x2="780" y2="614"/>

  <!-- version control: the project and its history -->
  <rect class="band vcs" x="40" y="616" width="890" height="186"/>
  <text class="s mech" x="60" y="644">バージョン管理（Git）</text>
  <rect class="box" x="60" y="670" width="430" height="114"/>
  <text class="c" x="275" y="706">プロジェクト</text>
  <text class="c mod" x="275" y="746">原稿、style.toml、フォント</text>
  <rect class="box" x="530" y="670" width="380" height="114"/>
  <text class="c" x="720" y="706">変更の履歴</text>
  <text class="c mod" x="720" y="746">誰がいつどの行を直したか</text>
  <line x1="492" y1="727" x2="528" y2="727"/>

  <!-- CI: build on every change -->
  <line x1="200" y1="804" x2="200" y2="852"/>
  <text class="s label" x="214" y="828">変更が届く</text>
  <rect class="band ci" x="40" y="854" width="380" height="170"/>
  <text class="s mech" x="60" y="884">CI</text>
  <text class="c" x="230" y="928">変更のたびに組む</text>
  <text class="c mod" x="230" y="966">PDF、HTML、EPUB、テキスト</text>
  <text class="c mod" x="230" y="996">プリフライト</text>

  <!-- determinism: the same input, the same bytes -->
  <line x1="422" y1="939" x2="468" y2="939"/>
  <rect class="band det" x="470" y="854" width="460" height="170"/>
  <text class="s mech" x="490" y="884">決定性</text>
  <rect class="box" x="486" y="908" width="194" height="64"/>
  <text class="c mod" x="583" y="940" style="font-size: 20px">手元で組んだ PDF</text>
  <text class="c" x="700" y="940" style="font-size: 34px">＝</text>
  <rect class="box" x="720" y="908" width="194" height="64"/>
  <text class="c mod" x="817" y="940" style="font-size: 20px">CI で組んだ PDF</text>
  <text class="c label" x="700" y="998">同じ入力なら一バイトも違わない</text>

  <!-- visual regression testing: compare the page images, show the changed pages -->
  <line x1="700" y1="1026" x2="700" y2="1068"/>
  <rect class="band vrt" x="40" y="1070" width="890" height="242"/>
  <text class="s mech" x="60" y="1098">見た目の回帰テスト（外部のツール）</text>
  <text class="s label" x="60" y="1169">前の PDF</text>
  <text class="s label" x="60" y="1257">新しい PDF</text>
  <path class="pg" d="M180,1130 L224,1130 L238,1144 L238,1208 L180,1208 Z"/>
  <path class="fold" d="M224,1130 L224,1144 L238,1144"/>
  <line class="txt" x1="190" y1="1156" x2="229" y2="1156"/>
  <line class="txt" x1="190" y1="1168" x2="229" y2="1168"/>
  <line class="txt" x1="190" y1="1180" x2="229" y2="1180"/>
  <line class="txt" x1="190" y1="1192" x2="214" y2="1192"/>
  <path class="pg" d="M180,1218 L224,1218 L238,1232 L238,1296 L180,1296 Z"/>
  <path class="fold" d="M224,1218 L224,1232 L238,1232"/>
  <line class="txt" x1="190" y1="1244" x2="229" y2="1244"/>
  <line class="txt" x1="190" y1="1256" x2="229" y2="1256"/>
  <line class="txt" x1="190" y1="1268" x2="229" y2="1268"/>
  <line class="txt" x1="190" y1="1280" x2="214" y2="1280"/>
  <path class="pg" d="M252,1130 L296,1130 L310,1144 L310,1208 L252,1208 Z"/>
  <path class="fold" d="M296,1130 L296,1144 L310,1144"/>
  <line class="txt" x1="262" y1="1156" x2="301" y2="1156"/>
  <line class="txt" x1="262" y1="1168" x2="301" y2="1168"/>
  <line class="txt" x1="262" y1="1180" x2="301" y2="1180"/>
  <line class="txt" x1="262" y1="1192" x2="286" y2="1192"/>
  <path class="pg" d="M252,1218 L296,1218 L310,1232 L310,1296 L252,1296 Z"/>
  <path class="fold" d="M296,1218 L296,1232 L310,1232"/>
  <line class="txt" x1="262" y1="1244" x2="301" y2="1244"/>
  <line class="txt" x1="262" y1="1256" x2="301" y2="1256"/>
  <line class="txt" x1="262" y1="1268" x2="301" y2="1268"/>
  <line class="txt" x1="262" y1="1280" x2="286" y2="1280"/>
  <path class="pg" d="M324,1130 L368,1130 L382,1144 L382,1208 L324,1208 Z"/>
  <path class="fold" d="M368,1130 L368,1144 L382,1144"/>
  <line class="txt" x1="334" y1="1156" x2="373" y2="1156"/>
  <line class="txt" x1="334" y1="1168" x2="373" y2="1168"/>
  <line class="txt" x1="334" y1="1180" x2="373" y2="1180"/>
  <line class="txt" x1="334" y1="1192" x2="358" y2="1192"/>
  <path class="pagex" d="M324,1218 L368,1218 L382,1232 L382,1296 L324,1296 Z"/>
  <path class="fold" d="M368,1218 L368,1232 L382,1232"/>
  <rect x="330" y="1251" width="46" height="22" fill="#dce8f5" stroke="#333" stroke-width="1.5"/>
  <line class="txt" x1="334" y1="1244" x2="373" y2="1244"/>
  <line class="txtx" x1="334" y1="1256" x2="373" y2="1256"/>
  <line class="txtx" x1="334" y1="1268" x2="373" y2="1268"/>
  <line class="txt" x1="334" y1="1280" x2="358" y2="1280"/>
  <path class="pg" d="M396,1130 L440,1130 L454,1144 L454,1208 L396,1208 Z"/>
  <path class="fold" d="M440,1130 L440,1144 L454,1144"/>
  <line class="txt" x1="406" y1="1156" x2="445" y2="1156"/>
  <line class="txt" x1="406" y1="1168" x2="445" y2="1168"/>
  <line class="txt" x1="406" y1="1180" x2="445" y2="1180"/>
  <line class="txt" x1="406" y1="1192" x2="430" y2="1192"/>
  <path class="pg" d="M396,1218 L440,1218 L454,1232 L454,1296 L396,1296 Z"/>
  <path class="fold" d="M440,1218 L440,1232 L454,1232"/>
  <line class="txt" x1="406" y1="1244" x2="445" y2="1244"/>
  <line class="txt" x1="406" y1="1256" x2="445" y2="1256"/>
  <line class="txt" x1="406" y1="1268" x2="445" y2="1268"/>
  <line class="txt" x1="406" y1="1280" x2="430" y2="1280"/>
  <line x1="464" y1="1213" x2="598" y2="1213"/>
  <text class="c label" x="530" y="1187">比べる</text>
  <rect class="box" x="600" y="1163" width="310" height="100"/>
  <text class="c" x="755" y="1196">人が確かめて直す</text>
  <text class="c mod" x="755" y="1234">変わったページだけ</text>

  <!-- fix and go round again -->
  <path class="edge" d="M912,1213 L965,1213 L965,709 L932,709"/>
</svg>
